---
- name: Ensure dependencies are installed
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
    state: present
  ignore_errors: true

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'

- name: Install and configure K3s server
  ansible.builtin.command:
    cmd: "/tmp/k3s_install.sh {{ k3s_install_args }}"
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: Ensure K3s service is started and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
  ignore_errors: true

- name: Verify K3s cluster node status
  ansible.builtin.command:
    cmd: "/usr/local/bin/kubectl get nodes --kubeconfig {{ k3s_kubeconfig_path }}"
  register: k3s_nodes
  changed_when: false
  ignore_errors: true

- name: Display cluster node status
  ansible.builtin.debug:
    var: k3s_nodes.stdout_lines
