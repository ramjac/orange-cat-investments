---
# Defaults for k3s_ha role
k3s_version: "v1.36.4+k3s1"
k3s_vip: "192.168.1.250"
k3s_vip_interface: "eth0"
k3s_vip_cidr: 24
k3s_kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

# K3s installation parameters
k3s_cluster_token: "OCI-SuperSecretClusterToken-ChangeMe-2026"
k3s_install_args: "--write-kubeconfig-mode 644 --disable=traefik --disable=servicelb --flannel-backend=vxlan"

# kube-vip version for control plane Virtual IP
kube_vip_version: "v0.8.9"
kube_vip_manifest_dir: "/var/lib/rancher/k3s/agent/pod-manifests"

# System prerequisites for Longhorn replicated block storage
longhorn_prereq_packages:
  - open-iscsi
  - nfs-common
  - cryptsetup
  - curl
  - ca-certificates
  - jq
  - iptables
