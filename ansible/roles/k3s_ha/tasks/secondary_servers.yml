---
- name: Download K3s installation script on secondary server
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'

- name: Deploy kube-vip manifest on secondary server
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: "{{ kube_vip_manifest_dir }}/kube-vip.yaml"
    mode: '0644'

- name: Join secondary K3s server to HA etcd cluster
  ansible.builtin.command:
    cmd: >
      /tmp/k3s_install.sh server
      --server https://{{ k3s_vip }}:6443
      --token {{ k3s_cluster_token }}
      --tls-san {{ k3s_vip }}
      --node-ip {{ ansible_host }}
      {{ k3s_install_args }}
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: Ensure K3s service is started and enabled on secondary server
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for secondary server to register and become ready
  ansible.builtin.command:
    cmd: "/usr/local/bin/kubectl get nodes --kubeconfig {{ k3s_kubeconfig_path }}"
  register: node_check
  until: node_check.rc == 0 and inventory_hostname in node_check.stdout
  retries: 20
  delay: 6
  changed_when: false
