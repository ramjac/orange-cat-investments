---
- name: Query all nodes across the HA cluster
  ansible.builtin.command:
    cmd: "/usr/local/bin/kubectl get nodes -o wide --kubeconfig {{ k3s_kubeconfig_path }}"
  register: cluster_nodes
  changed_when: false

- name: Display K3s HA Cluster Node Status
  ansible.builtin.debug:
    var: cluster_nodes.stdout_lines

- name: Check embedded etcd member list and health
  ansible.builtin.command:
    cmd: "/usr/local/bin/k3s etcd-snapshot list"
  register: etcd_health
  changed_when: false
  ignore_errors: true

- name: Display embedded etcd status
  ansible.builtin.debug:
    var: etcd_health.stdout_lines
