---
- name: Determine active kubeconfig path
  ansible.builtin.set_fact:
    active_kubeconfig: "{{ k8s_kubeconfig_path | default(microk8s_kubeconfig_path) }}"

- name: Ensure kubectl is available
  ansible.builtin.command:
    cmd: kubectl version --client
  changed_when: false

- name: Deploy Kubernetes Namespaces
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k8s_manifests_dir }}/namespaces/ --kubeconfig={{ active_kubeconfig }}"

- name: Deploy Core Infrastructure & Applications (oci-core)
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k8s_manifests_dir }}/oci-core/ --kubeconfig={{ active_kubeconfig }}"

- name: Deploy Internal COTS Business Applications (oci-internal)
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k8s_manifests_dir }}/oci-internal/ --kubeconfig={{ active_kubeconfig }}"

- name: Deploy External Simulation Microservices (external-sim)
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k8s_manifests_dir }}/external-sim/ --kubeconfig={{ active_kubeconfig }}"

- name: Deploy Monitoring Stack (Prometheus + Grafana)
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k8s_manifests_dir }}/monitoring/ --kubeconfig={{ active_kubeconfig }}"

- name: Deploy Logging Stack (Loki + Promtail)
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k8s_manifests_dir }}/logging/ --kubeconfig={{ active_kubeconfig }}"
