---
microk8s_channel: "1.34/stable"
microk8s_addons:
  - dns
  - storage
  - ingress
  - registry
  - metrics-server
microk8s_user: "{{ ansible_user | default(ansible_env.USER | default('ubuntu')) }}"
microk8s_kubeconfig_path: "/var/snap/microk8s/current/credentials/client.config"
export_kubeconfig_to_user: true
