          format: uuid
        serial_number:
          type: string
        asset_type:
          type: string
          enum: [edge_camera, gateway, networking_switch, laptop, workstation, pebble_watch, smartphone]
        model:
          type: string
        status:
          type: string
          enum: [active, maintenance_required, offline, pending_return, decommissioned]
        zone_id:
          type: string
          format: uuid
          nullable: true
        assigned_employee_id:
          type: string
          format: uuid
          nullable: true
        last_ping_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

