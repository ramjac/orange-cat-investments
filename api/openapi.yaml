openapi: 3.1.0
info:
  title: Orange Cat Investments (OCI) Platform API
  description: API specification for OCI Backend-For-Frontend (BFF) endpoints serving Customer Portal (`customer.oci.local`) and Employee Portal (`employee.oci.local`).
  version: 1.0.0
servers:
  - url: https://api.oci.local/api/v1
    description: Common Ingress Development API Router
  - url: https://customer.oci.local/api/v1
    description: Customer BFF (ZITADEL OIDC Auth)
  - url: https://employee.oci.local/api/v1
    description: Employee BFF (Forgejo OAuth2 Auth)

paths:
  /employee/csrf:
    get:
      summary: Get CSRF Token
      operationId: getEmployeeCSRFToken
      tags:
        - Employee Auth
      responses:
        '200':
          description: CSRF token successfully retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
  /employee/auth/login:
    post:
      summary: Employee Login
      operationId: employeeLogin
      tags:
        - Employee Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
                - role
              properties:
                employee_id:
                  type: string
                role:
                  type: string
                name:
                  type: string
                email:
                  type: string
                department:
                  type: string
      responses:
        '200':
          description: Successfully authenticated
        '400':
          description: Bad request
  /employee/auth/logout:
    post:
      summary: Employee Logout
      operationId: employeeLogout
      tags:
        - Employee Auth
      responses:
        '200':
          description: Successfully logged out
  /employee/auth/session:
    get:
      summary: Get Current Employee Session
      operationId: getEmployeeSession
      tags:
        - Employee Auth
      responses:
        '200':
          description: Active employee session details
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /facilities/assets:
    get:
      summary: List Hardware Assets
      operationId: listAssets
      tags:
        - Facilities Assets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, maintenance_required, offline, pending_return, decommissioned]
        - name: asset_type
          in: query
          required: false
          schema:
            type: string
            enum: [edge_camera, gateway, networking_switch, laptop, workstation, pebble_watch, smartphone]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: last_created_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of hardware assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HardwareAsset'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

    post:
      summary: Register New Hardware Asset
      operationId: createAsset
      tags:
        - Facilities Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwareAssetCreate'
      responses:
        '201':
          description: Hardware asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAsset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /facilities/assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get Hardware Asset Details
      operationId: getAssetById
      tags:
        - Facilities Assets
      responses:
        '200':
          description: Hardware asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAsset'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      summary: Update Hardware Asset Details
      operationId: updateAsset
      tags:
        - Facilities Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwareAssetUpdate'
      responses:
        '200':
          description: Hardware asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAsset'
        '404':
          $ref: '#/components/responses/404NotFound'

    delete:
      summary: Decommission Hardware Asset
      operationId: deleteAsset
      tags:
        - Facilities Assets
      responses:
        '204':
          description: Hardware asset decommissioned

  /facilities/assets/{id}/maintenance:
    post:
      summary: Report Maintenance / Create Maintenance Ticket
      operationId: reportMaintenance
      tags:
        - Facilities Maintenance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTicketCreate'
      responses:
        '201':
          description: Maintenance ticket generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicket'

  /facilities/sync/maintenance-logs:
    post:
      summary: Batch Sync Offline Maintenance Logs
      operationId: syncMaintenanceLogs
      tags:
        - Facilities Maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MaintenanceLogCreate'
      responses:
        '200':
          description: Offline maintenance logs synced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced_count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceLog'

  /facilities/firmware:
    get:
      summary: List Firmware Releases
      operationId: listFirmwareReleases
      tags:
        - Facilities Firmware
      parameters:
        - name: device_type
          in: query
          required: true
          schema:
            type: string
            enum: [edge_camera, gateway, networking_switch, pebble_watch, workstation, smartphone]
      responses:
        '200':
          description: List of firmware releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FirmwareRelease'

    post:
      summary: Publish Firmware Release
      operationId: createFirmwareRelease
      tags:
        - Facilities Firmware
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareReleaseCreate'
      responses:
        '201':
          description: Firmware release created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareRelease'

  /facilities/firmware/ota-jobs:
    get:
      summary: List Device OTA Jobs
      operationId: listOTAJobs
      tags:
        - Facilities Firmware
      parameters:
        - name: asset_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of OTA jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceOTAJob'

    post:
      summary: Trigger OTA Firmware Update Pipeline
      operationId: triggerOTAUpdate
      tags:
        - Facilities Firmware
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTATriggerRequest'
      responses:
        '202':
          description: OTA update pipeline triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceOTAJob'

  /workforce/employees:
    get:
      summary: List Employees (Human and Feline)
      operationId: listEmployees
      tags:
        - Workforce Management
      parameters:
        - name: employee_type
          in: query
          required: false
          schema:
            type: string
            enum: [human, feline]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [onboarding, active, on_leave, separated, retired]
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
                  total:
                    type: integer

  /workforce/employees/onboard:
    post:
      summary: Onboard New Employee
      operationId: onboardEmployee
      tags:
        - Workforce Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeOnboardRequest'
      responses:
        '201':
          description: Employee successfully initiated onboarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /workforce/employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get Employee Details
      operationId: getEmployeeById
      tags:
        - Workforce Management
      responses:
        '200':
          description: Employee detailed profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workforce/employees/{id}/onboarding:
    get:
      summary: Get Employee Onboarding Checklist
      operationId: getEmployeeOnboardingChecklist
      tags:
        - Workforce Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of onboarding checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnboardingChecklistTask'

  /workforce/onboarding/tasks/{taskId}:
    put:
      summary: Update Onboarding Checklist Task Status
      operationId: updateOnboardingTask
      tags:
        - Workforce Management
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_completed
              properties:
                is_completed:
                  type: boolean
      responses:
        '200':
          description: Checklist task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingChecklistTask'

  /workforce/leave-requests:
    get:
      summary: List Leave Requests
      operationId: listLeaveRequests
      tags:
        - Workforce Leave
      parameters:
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
      responses:
        '200':
          description: List of leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'

    post:
      summary: Submit Leave Request
      operationId: createLeaveRequest
      tags:
        - Workforce Leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestCreate'
      responses:
        '201':
          description: Leave request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'

  /workforce/leave-requests/{id}/status:
    put:
      summary: Approve or Reject Leave Request
      operationId: updateLeaveStatus
      tags:
        - Workforce Leave
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveStatusUpdate'
      responses:
        '200':
          description: Leave request status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'

  /workforce/review-cycles:
    get:
      summary: List Review Cycles
      operationId: listReviewCycles
      tags:
        - Workforce Reviews
      parameters:
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, in_progress, completed, overdue]
        - name: review_type
          in: query
          required: false
          schema:
            type: string
            enum: [performance, feline_health_assessment]
      responses:
        '200':
          description: List of review cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewCycle'

    post:
      summary: Schedule Review Cycle
      operationId: createReviewCycle
      tags:
        - Workforce Reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCycleCreate'
      responses:
        '201':
          description: Review cycle scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'

  /workforce/review-cycles/{id}:
    get:
      summary: Get Review Cycle Details
      operationId: getReviewCycle
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review cycle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      summary: Update Review Cycle Evaluation
      operationId: updateReviewCycle
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCycleUpdate'
      responses:
        '200':
          description: Review cycle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workforce/review-cycles/{id}/self-appraisal:
    post:
      summary: Submit Employee Self-Appraisal
      operationId: submitSelfAppraisal
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAppraisalRequest'
      responses:
        '200':
          description: Self-appraisal submitted and phase advanced to peer feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'

  /workforce/review-cycles/{id}/peer-feedback:
    post:
      summary: Submit Peer Evaluation Feedback
      operationId: submitPeerFeedback
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeerFeedbackRequest'
      responses:
        '200':
          description: Peer feedback recorded and phase advanced to manager review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'

  /workforce/review-cycles/{id}/manager-assessment:
    post:
      summary: Submit Manager Assessment & Final KPI Ratings
      operationId: submitManagerAssessment
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerAssessmentRequest'
      responses:
        '200':
          description: Manager assessment recorded and review cycle finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'

  /workforce/review-cycles/{id}/vet-audit:
    post:
      summary: Submit Veterinary Clinical Wellness Audit
      operationId: submitVeterinaryAudit
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeterinaryAuditRequest'
      responses:
        '200':
          description: Veterinary wellness audit and habitat recommendations stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'

  /workforce/care-schedules/{felineId}:
    parameters:
      - name: felineId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get Feline Care Schedule
      operationId: getCareSchedule
      tags:
        - Care Schedules
      responses:
        '200':
          description: Feline Care Schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareSchedule'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      summary: Update Feline Care Schedule
      operationId: updateCareSchedule
      tags:
        - Care Schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareScheduleUpdate'
      responses:
        '200':
          description: Feline Care Schedule Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareSchedule'

  /workforce/care-schedules/{felineId}/medical-hold:
    parameters:
      - name: felineId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Toggle Emergency Medical Trading Hold
      operationId: toggleEmergencyMedicalHold
      tags:
        - Care Schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emergency_medical_hold
              properties:
                emergency_medical_hold:
                  type: boolean
      responses:
        '200':
          description: Emergency medical hold status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareSchedule'

  /workforce/timesheets:
    get:
      summary: List Workforce Timesheets
      operationId: listTimesheets
      tags:
        - Workforce Attendance
      parameters:
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, submitted, approved, rejected]
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: task_code
          in: query
          required: false
          schema:
            type: string
            enum: [habitat_maintenance, feline_feeding, veterinary_assist, admin, invest_ops]
      responses:
        '200':
          description: List of timesheet entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Timesheet'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'

    post:
      summary: Submit Daily Timesheet Entry
      operationId: submitTimesheet
      tags:
        - Workforce Attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetSubmitRequest'
      responses:
        '201':
          description: Timesheet created and submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /workforce/timesheets/{id}:
    get:
      summary: Get Timesheet Entry by ID
      operationId: getTimesheet
      tags:
        - Workforce Attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timesheet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workforce/timesheets/{id}/status:
    put:
      summary: Approve or Reject Timesheet Entry
      operationId: updateTimesheetStatus
      tags:
        - Workforce Attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetStatusUpdateRequest'
      responses:
        '200':
          description: Timesheet status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /workforce/payroll/slips:
    get:
      summary: List Employee Salary Slips
      operationId: listSalarySlips
      tags:
        - Workforce Compensation
      parameters:
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of employee salary slips
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalarySlip'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /workforce/payroll/slips/{id}:
    get:
      summary: Get Salary Slip Details
      operationId: getSalarySlip
      tags:
        - Workforce Compensation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Salary slip details with earnings and deductions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarySlip'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workforce/payroll/run:
    post:
      summary: Execute Departmental or Company Payroll Run
      operationId: processPayrollRun
      tags:
        - Workforce Compensation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollEntry'
      responses:
        '201':
          description: Payroll run executed and salary slips created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollEntry'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /workforce/employees/onboard:
    post:
      summary: Onboard New Employee & Execute IT Provisioning Saga
      operationId: onboardEmployee
      tags:
        - Workforce Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '201':
          description: Employee successfully onboarded with COTS IT assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /workforce/employees/{id}/offboard:
    post:
      summary: Offboard Employee & Execute Deprovisioning Engine
      operationId: offboardEmployee
      tags:
        - Workforce Operations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffboardingRequest'
      responses:
        '200':
          description: Employee offboarded and assets deprovisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingResult'
        '400':
