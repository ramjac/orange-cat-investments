      summary: Generate Monthly Statement or Form 1099-B On-Demand
      description: Compiles holdings, trade executions, capital gain lots, and renders an authenticated PDF 1.4 document.
      operationId: generateCustomerStatement
      tags:
        - Customer Statements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateStatementRequest'
      responses:
        '201':
          description: Statement generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentStatementMetadata'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /customer/statements/{id}/download:
    get:
      summary: Download Investment Statement or Tax Form (PDF 1.4)
      description: Downloads an authenticated PDF 1.4 document for monthly summaries or Form 1099-B tax returns.
      operationId: downloadCustomerStatementPDF
      tags:
        - Customer Statements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF binary document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /customer/search:
    get:
      summary: Typo-Tolerant Full-Text Search across Investment Catalog, ESG Welfare, and Tax Documents (Meilisearch)
      operationId: searchCustomerCatalog
      tags:
        - Customer Search
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search hits returned from Meilisearch
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                  query:
                    type: string
                  totalHits:
                    type: integer
                  processingTimeMs:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/v1/customer/webhooks:
    get:
      summary: List Registered Webhooks
      operationId: listCustomerWebhooks
      tags:
        - Customer Webhooks
      responses:
        '200':
          description: List of registered webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    post:
      summary: Register a Customer Webhook
      operationId: createCustomerWebhook
      tags:
        - Customer Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_url
              properties:
                target_url:
                  type: string
                  format: uri
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/v1/customer/webhooks/{id}:
    delete:
      summary: Delete Customer Webhook Subscription
      operationId: deleteCustomerWebhook
      tags:
        - Customer Webhooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook subscription successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  webhook_id:
                    type: string
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /employee/search:
    get:
      summary: Global Command+K Typo-Tolerant Full-Text Search across Enterprise Knowledge (Meilisearch)
      operationId: searchEmployeeKnowledge
      tags:
        - Employee Search
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search hits returned from Meilisearch
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                  query:
                    type: string
                  totalHits:
                    type: integer
                  processingTimeMs:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /ops/pebble/alerts:
    get:
      summary: Get Pebble Companion Watch Alert Payloads
      operationId: getPebbleAlerts
      tags:
        - Wearable Proxy
      responses:
        '200':
          description: List of active alert payloads formatted for Pebble watch AppMessage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PebbleAlertPayload'

  /ops/pebble/ack:
    post:
      summary: Submit Pebble Watch ACK Button Interaction
      operationId: submitPebbleAck
      tags:
        - Wearable Proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PebbleAckRequest'
      responses:
        '200':
          description: ACK processed and ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PebbleAckResponse'

components:
  schemas:
    WebhookSubscription:
      type: object
      required:
        - webhook_id
        - customer_id
        - target_url
        - events
        - status
        - created_at
      properties:
        webhook_id:
          type: string
          format: uuid
        customer_id:
          type: string
        target_url:
          type: string
          format: uri
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        secret:
          type: string
        status:
          type: string
          enum: [active, paused, revoked]
        created_at:
          type: string
          format: date-time

    HardwareAsset:
      type: object
