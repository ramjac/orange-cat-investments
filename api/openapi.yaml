openapi: 3.1.0
info:
  title: Orange Cat Investments (OCI) Platform API
  description: API specification for OCI Backend-For-Frontend (BFF) endpoints serving Customer Portal (`customer.oci.local`) and Employee Portal (`employee.oci.local`).
  version: 1.0.0
servers:
  - url: https://api.oci.local/api/v1
    description: Common Ingress Development API Router
  - url: https://customer.oci.local/api/v1
    description: Customer BFF (ZITADEL OIDC Auth)
  - url: https://employee.oci.local/api/v1
    description: Employee BFF (Forgejo OAuth2 Auth)

paths:
  /facilities/assets:
    get:
      summary: List Hardware Assets
      operationId: listAssets
      tags:
        - Facilities Assets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, maintenance_required, offline, pending_return, decommissioned]
        - name: asset_type
          in: query
          required: false
          schema:
            type: string
            enum: [edge_camera, observation_perch, smart_collar, gateway, feeder, laptop]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: last_created_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of hardware assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HardwareAsset'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

    post:
      summary: Register New Hardware Asset
      operationId: createAsset
      tags:
        - Facilities Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwareAssetCreate'
      responses:
        '201':
          description: Hardware asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAsset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /facilities/assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get Hardware Asset Details
      operationId: getAssetById
      tags:
        - Facilities Assets
      responses:
        '200':
          description: Hardware asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAsset'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      summary: Update Hardware Asset Details
      operationId: updateAsset
      tags:
        - Facilities Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwareAssetUpdate'
      responses:
        '200':
          description: Hardware asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAsset'
        '404':
          $ref: '#/components/responses/404NotFound'

    delete:
      summary: Decommission Hardware Asset
      operationId: deleteAsset
      tags:
        - Facilities Assets
      responses:
        '204':
          description: Hardware asset decommissioned

  /facilities/assets/{id}/maintenance:
    post:
      summary: Report Maintenance / Create Maintenance Ticket
      operationId: reportMaintenance
      tags:
        - Facilities Maintenance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTicketCreate'
      responses:
        '201':
          description: Maintenance ticket generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTicket'

  /facilities/sync/maintenance-logs:
    post:
      summary: Batch Sync Offline Maintenance Logs
      operationId: syncMaintenanceLogs
      tags:
        - Facilities Maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MaintenanceLogCreate'
      responses:
        '200':
          description: Offline maintenance logs synced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced_count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceLog'

  /facilities/firmware:
    get:
      summary: List Firmware Releases
      operationId: listFirmwareReleases
      tags:
        - Facilities Firmware
      parameters:
        - name: device_type
          in: query
          required: true
          schema:
            type: string
            enum: [edge_camera, observation_perch, smart_collar, gateway, feeder]
      responses:
        '200':
          description: List of firmware releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FirmwareRelease'

    post:
      summary: Publish Firmware Release
      operationId: createFirmwareRelease
      tags:
        - Facilities Firmware
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareReleaseCreate'
      responses:
        '201':
          description: Firmware release created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareRelease'

  /facilities/firmware/ota-jobs:
    get:
      summary: List Device OTA Jobs
      operationId: listOTAJobs
      tags:
        - Facilities Firmware
      parameters:
        - name: asset_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of OTA jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceOTAJob'

    post:
      summary: Trigger OTA Firmware Update Pipeline
      operationId: triggerOTAUpdate
      tags:
        - Facilities Firmware
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTATriggerRequest'
      responses:
        '202':
          description: OTA update pipeline triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceOTAJob'

  /workforce/employees:
    get:
      summary: List Employees (Human and Feline)
      operationId: listEmployees
      tags:
        - Workforce Management
      parameters:
        - name: employee_type
          in: query
          required: false
          schema:
            type: string
            enum: [human, feline]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [onboarding, active, on_leave, separated, retired]
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
                  total:
                    type: integer

  /workforce/employees/onboard:
    post:
      summary: Onboard New Employee
      operationId: onboardEmployee
      tags:
        - Workforce Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeOnboardRequest'
      responses:
        '201':
          description: Employee successfully initiated onboarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /workforce/employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get Employee Details
      operationId: getEmployeeById
      tags:
        - Workforce Management
      responses:
        '200':
          description: Employee detailed profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workforce/employees/{id}/onboarding:
    get:
      summary: Get Employee Onboarding Checklist
      operationId: getEmployeeOnboardingChecklist
      tags:
        - Workforce Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of onboarding checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnboardingChecklistTask'

  /workforce/onboarding/tasks/{taskId}:
    put:
      summary: Update Onboarding Checklist Task Status
      operationId: updateOnboardingTask
      tags:
        - Workforce Management
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_completed
              properties:
                is_completed:
                  type: boolean
      responses:
        '200':
          description: Checklist task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingChecklistTask'

  /workforce/leave-requests:
    get:
      summary: List Leave Requests
      operationId: listLeaveRequests
      tags:
        - Workforce Leave
      parameters:
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
      responses:
        '200':
          description: List of leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'

    post:
      summary: Submit Leave Request
      operationId: createLeaveRequest
      tags:
        - Workforce Leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestCreate'
      responses:
        '201':
          description: Leave request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'

  /workforce/leave-requests/{id}/status:
    put:
      summary: Approve or Reject Leave Request
      operationId: updateLeaveStatus
      tags:
        - Workforce Leave
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveStatusUpdate'
      responses:
        '200':
          description: Leave request status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'

  /workforce/review-cycles:
    get:
      summary: List Review Cycles
      operationId: listReviewCycles
      tags:
        - Workforce Reviews
      parameters:
        - name: employee_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, in_progress, completed, overdue]
        - name: review_type
          in: query
          required: false
          schema:
            type: string
            enum: [performance, feline_health_assessment]
      responses:
        '200':
          description: List of review cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewCycle'

    post:
      summary: Schedule Review Cycle
      operationId: createReviewCycle
      tags:
        - Workforce Reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCycleCreate'
      responses:
        '201':
          description: Review cycle scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'

  /workforce/review-cycles/{id}:
    get:
      summary: Get Review Cycle Details
      operationId: getReviewCycle
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review cycle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      summary: Update Review Cycle Evaluation
      operationId: updateReviewCycle
      tags:
        - Workforce Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCycleUpdate'
      responses:
        '200':
          description: Review cycle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycle'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workforce/care-schedules/{felineId}:
    parameters:
      - name: felineId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get Feline Care Schedule
      operationId: getCareSchedule
      tags:
        - Care Schedules
      responses:
        '200':
          description: Feline Care Schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareSchedule'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      summary: Update Feline Care Schedule
      operationId: updateCareSchedule
      tags:
        - Care Schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareScheduleUpdate'
      responses:
        '200':
          description: Feline Care Schedule Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareSchedule'

  /workforce/care-schedules/{felineId}/medical-hold:
    parameters:
      - name: felineId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Toggle Emergency Medical Trading Hold
      operationId: toggleEmergencyMedicalHold
      tags:
        - Care Schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emergency_medical_hold
              properties:
                emergency_medical_hold:
                  type: boolean
      responses:
        '200':
          description: Emergency medical hold status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareSchedule'

  /webhooks/frappe-hr:
    post:
      summary: Frappe HR Status Change Webhook Ingestion
      operationId: handleFrappeHRWebhook
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrappeHRWebhookPayload'
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  action:
                    type: string

  /core-invest/streams:
    get:
      summary: List Camera Ingestion Streams
      operationId: listCameraStreams
      tags:
        - Stream Ingestion
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of camera ingestion streams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CameraStream'
        '401':
          $ref: '#/components/responses/401Unauthorized'

    post:
      summary: Register Camera Ingestion Stream
      operationId: createCameraStream
      tags:
        - Stream Ingestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraStreamCreate'
      responses:
        '201':
          description: Camera stream registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraStream'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /core-invest/brokerage/orders:
    get:
      summary: List Brokerage Orders
      operationId: listBrokerageOrders
      tags:
        - Brokerage Execution
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of brokerage execution orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrokerageOrder'

    post:
      summary: Execute Automated Brokerage Order
      operationId: createBrokerageOrder
      tags:
        - Brokerage Execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerageOrderCreate'
      responses:
        '201':
          description: Brokerage order submitted and executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerageOrder'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /core-invest/brokerage/orders/{id}:
    get:
      summary: Get Brokerage Order Details
      operationId: getBrokerageOrderById
      tags:
        - Brokerage Execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Brokerage order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerageOrder'
        '404':
          $ref: '#/components/responses/404NotFound'

  /core-invest/backtesting/runs:
    get:
      summary: List Backtest Runs
      operationId: listBacktestRuns
      tags:
        - Backtesting Workbench
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of backtest runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BacktestRun'

    post:
      summary: Start Backtest Run
      operationId: createBacktestRun
      tags:
        - Backtesting Workbench
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRunCreate'
      responses:
        '201':
          description: Backtest run initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRun'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /core-invest/backtesting/runs/{id}:
    get:
      summary: Get Backtest Run Results
      operationId: getBacktestRunById
      tags:
        - Backtesting Workbench
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Backtest run details and results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRun'
        '404':
          $ref: '#/components/responses/404NotFound'

  /ops/tickets:
    get:
      summary: List IT Helpdesk Tickets
      operationId: listITTickets
      tags:
        - IT Operations
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed, acknowledged]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of IT tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ITTicket'
                  total:
                    type: integer
    post:
      summary: Create IT Helpdesk Ticket
      operationId: createITTicket
      tags:
        - IT Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ITTicketCreate'
      responses:
        '201':
          description: IT ticket created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ITTicket'

  /ops/pebble/alerts:
    get:
      summary: Get Pebble Companion Watch Alert Payloads
      operationId: getPebbleAlerts
      tags:
        - Wearable Proxy
      responses:
        '200':
          description: List of active alert payloads formatted for Pebble watch AppMessage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PebbleAlertPayload'

  /ops/pebble/ack:
    post:
      summary: Submit Pebble Watch ACK Button Interaction
      operationId: submitPebbleAck
      tags:
        - Wearable Proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PebbleAckRequest'
      responses:
        '200':
          description: ACK processed and ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PebbleAckResponse'

components:
  schemas:
    HardwareAsset:
      type: object
      required:
        - asset_id
        - serial_number
        - asset_type
        - model
        - status
        - created_at
      properties:
        asset_id:
          type: string
          format: uuid
        serial_number:
          type: string
        asset_type:
          type: string
          enum: [edge_camera, observation_perch, smart_collar, gateway, feeder, laptop]
        model:
          type: string
        status:
          type: string
          enum: [active, maintenance_required, offline, pending_return, decommissioned]
        zone_id:
          type: string
          format: uuid
          nullable: true
        assigned_employee_id:
          type: string
          format: uuid
          nullable: true
        last_ping_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HardwareAssetCreate:
      type: object
      required:
        - serial_number
        - asset_type
        - model
      properties:
        serial_number:
          type: string
        asset_type:
          type: string
          enum: [edge_camera, observation_perch, smart_collar, gateway, feeder, laptop]
        model:
          type: string
        zone_id:
          type: string
          format: uuid
        assigned_employee_id:
          type: string
          format: uuid
          nullable: true

    HardwareAssetUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, maintenance_required, offline, pending_return, decommissioned]
        zone_id:
          type: string
          format: uuid
        assigned_employee_id:
          type: string
          format: uuid

    MaintenanceTicket:
      type: object
      required:
        - ticket_id
        - asset_id
        - title
        - description
        - priority
        - status
        - created_at
      properties:
        ticket_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        assigned_technician_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    MaintenanceTicketCreate:
      type: object
      required:
        - title
        - description
        - priority
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]

    MaintenanceLog:
      type: object
      required:
        - log_id
