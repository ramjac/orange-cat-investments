version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smb-postgres
    environment:
      POSTGRES_USER: smb
      POSTGRES_PASSWORD: smb_secure_password
      POSTGRES_DB: smb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/01-workforce-core.sql:/docker-entrypoint-initdb.d/01-workforce.sql
      - ./scripts/02-facilities-core.sql:/docker-entrypoint-initdb.d/02-facilities.sql
      - ./scripts/03-ops-core.sql:/docker-entrypoint-initdb.d/03-ops.sql

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: smb-valkey
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smb-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21-rootless
    container_name: smb-forgejo
    ports:
      - "3000:3000"
      - "2222:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000

volumes:
  postgres-data:
