apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-broker-route
  namespace: external-sim
  labels:
    owner: emp-human-elise
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oci-edge-gateway
      namespace: oci-core
  hostnames:
    - broker-api.sim.oci.local
    - data-api.sim.oci.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 3600s
      backendRefs:
        - name: mock-broker-service
          port: 8089
