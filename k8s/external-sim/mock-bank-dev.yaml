apiVersion: v1
kind: Secret
metadata:
  name: mock-bank-dev-credentials
  namespace: external-sim
type: Opaque
stringData:
  PLAID_CLIENT_ID: "client_oci_sim_01"
  PLAID_SECRET: "sec_oci_sim_test_8829"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-bank-dev
  namespace: external-sim
  labels:
    app: mock-bank-dev
    environment: simulated-external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-bank-dev
  template:
    metadata:
      labels:
        app: mock-bank-dev
        environment: simulated-external
    spec:
      containers:
        - name: mock-bank-dev
          image: localhost:32000/mock-bank:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: ENABLE_FAULT_INJECTION
              value: "true"
            - name: PORT
              value: "8088"
            - name: PLAID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mock-bank-dev-credentials
                  key: PLAID_CLIENT_ID
            - name: PLAID_SECRET
              valueFrom:
                secretKeyRef:
                  name: mock-bank-dev-credentials
                  key: PLAID_SECRET
            - name: ACH_TICK_INTERVAL_MS
              value: "1000"
            - name: OCI_WEBHOOK_URL
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mock-bank-dev-service
  namespace: external-sim
  labels:
    app: mock-bank-dev
spec:
  ports:
    - port: 8088
      targetPort: 8088
      name: http
  selector:
    app: mock-bank-dev
