apiVersion: v1
kind: Secret
metadata:
  name: mock-broker-dev-credentials
  namespace: external-sim
type: Opaque
stringData:
  APCA_API_KEY_ID: "CK_OCI_TEST_KEY_01"
  APCA_API_SECRET_KEY: "SK_OCI_TEST_SECRET_01"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-broker-dev
  namespace: external-sim
  labels:
    app: mock-broker-dev
    environment: simulated-external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-broker-dev
  template:
    metadata:
      labels:
        app: mock-broker-dev
        environment: simulated-external
    spec:
      containers:
        - name: mock-broker-dev
          image: localhost:32000/mock-broker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8089
              name: http
          env:
            - name: ENABLE_FAULT_INJECTION
              value: "true"
            - name: PORT
              value: "8089"
            - name: APCA_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mock-broker-dev-credentials
                  key: APCA_API_KEY_ID
            - name: APCA_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mock-broker-dev-credentials
                  key: APCA_API_SECRET_KEY
            - name: TICK_INTERVAL_MS
              value: "1000"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mock-broker-dev-service
  namespace: external-sim
  labels:
    app: mock-broker-dev
spec:
  ports:
    - port: 8089
      targetPort: 8089
      name: http
  selector:
    app: mock-broker-dev
