apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-hardware-dev
  namespace: external-sim
  labels:
    app: mock-hardware-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-hardware-dev
  namespace: external-sim
  labels:
    app: mock-hardware-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-hardware-dev
  template:
    metadata:
      labels:
        app: mock-hardware-dev
        environment: simulated-external
    spec:
      serviceAccountName: mock-hardware-dev
      containers:
        - name: mock-hardware-dev
          image: localhost:32000/mock-hardware:latest
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              value: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-dev.svc.cluster.local:5672/"
            - name: INTERNAL_BLL_ADDR
              value: "internal-bll-service.oci-dev.svc.cluster.local:8086"
            - name: MOCK_CAMERA_SERIAL
              value: "QR-CAM-ORANGE-01"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/etc/tls/ca/ca.crt"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
      volumes:
        - name: tls-certs
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
