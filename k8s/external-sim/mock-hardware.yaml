apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-hardware
  namespace: external-sim
  labels:
    app: mock-hardware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-hardware
  template:
    metadata:
      labels:
        app: mock-hardware
    spec:
      containers:
        - name: mock-hardware
          image: localhost:32000/mock-hardware:latest
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  optional: true
                  key: rabbitmq_url
            - name: INTERNAL_BLL_ADDR
              value: "internal-bll-service.oci-core.svc.cluster.local:8086"
            - name: INSECURE
              value: "true"
