apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-hardware
  namespace: external-sim
  labels:
    app: mock-hardware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-hardware
  template:
    metadata:
      labels:
        app: mock-hardware
    spec:
      containers:
        - name: mock-hardware
          image: localhost:32000/mock-hardware:latest
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              value: "amqp://oci_rabbit:orange_cat_mq_2024@rabbitmq-service.oci-core.svc.cluster.local:5672/"
            - name: INTERNAL_BLL_ADDR
              value: "internal-bll-service.oci-core.svc.cluster.local:8086"
            - name: TLS_CERT_FILE
              value: "/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/certs/ca.crt"
          volumeMounts:
            - name: certs
              mountPath: "/certs"
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: employee-bff-tls-certs
