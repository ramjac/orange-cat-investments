apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-hardware
  namespace: external-sim
  labels:
    app: mock-hardware
    environment: simulated-external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-hardware
    environment: simulated-external
  template:
    metadata:
      labels:
        app: mock-hardware
    environment: simulated-external
    spec:
      containers:
        - name: mock-hardware
          image: localhost:32000/mock-hardware:latest
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: oci-secrets
                  key: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  optional: true
                  key: rabbitmq_url
            - name: INTERNAL_BLL_ADDR
              value: "internal-bll-service.oci-core.svc.cluster.local:8086"
            - name: INSECURE
              value: "true"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mock-hardware-tls
  namespace: external-sim
spec:
  secretName: mock-hardware-tls-certs
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  subject:
    organizations:
      - Orange Cat Investments (External Simulation)
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - client auth
  dnsNames:
    - mock-hardware
    - mock-hardware.external-sim
    - mock-hardware.external-sim.svc
    - mock-hardware.external-sim.svc.cluster.local
  issuerRef:
    name: oci-lan-issuer
    kind: ClusterIssuer
    group: cert-manager.io
