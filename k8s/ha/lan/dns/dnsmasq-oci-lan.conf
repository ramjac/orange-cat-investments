# ==============================================================================
# Orange Cat Investments (OCI) - Dnsmasq Configuration (/etc/dnsmasq.d/oci-lan.conf)
# ==============================================================================
# Route all queries for *.oci.local domain to cluster Virtual IP (VIP)
address=/oci.local/192.168.1.250

# Explicit pointer records for reverse DNS lookup
ptr-record=250.1.168.192.in-addr.arpa,cluster-vip.oci.local

# Prevent forwarding .local domains upstream to public DNS
local=/oci.local/
domain=oci.local
