apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: oci-lan-pool
  namespace: metallb-system
spec:
  addresses:
    # Dedicated static LAN IP addresses for cluster ingress / LoadBalancer services.
    # Note: 192.168.1.250 is reserved exclusively for the kube-vip control-plane VIP.
    - 192.168.1.251-192.168.1.254
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: oci-lan-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - oci-lan-pool
  interfaces:
    - eth0
