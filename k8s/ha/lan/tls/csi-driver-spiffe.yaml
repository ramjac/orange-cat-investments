# cert-manager-csi-driver-spiffe v0.15.1 (MicroK8s-configured)
# Provisions ephemeral 1h SPIFFE X.509-SVIDs (spiffe://oci.local/ns/<ns>/sa/<sa>)
# directly into node-local tmpfs memory (/dev/shm/cert-manager-csi-driver-spiffe).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-csi-driver-spiffe
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-csi-driver-spiffe-approver
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-csi-driver-spiffe
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["watch", "create", "delete", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-csi-driver-spiffe-approver
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status"]
    verbs: ["update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-csi-driver-spiffe
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-csi-driver-spiffe
subjects:
  - kind: ServiceAccount
    name: cert-manager-csi-driver-spiffe
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-csi-driver-spiffe-approver
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-csi-driver-spiffe-approver
subjects:
  - kind: ServiceAccount
    name: cert-manager-csi-driver-spiffe-approver
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-csi-driver-spiffe
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-csi-driver-spiffe-approver
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-csi-driver-spiffe
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-csi-driver-spiffe
subjects:
  - kind: ServiceAccount
    name: cert-manager-csi-driver-spiffe
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-csi-driver-spiffe-approver
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-csi-driver-spiffe-approver
subjects:
  - kind: ServiceAccount
    name: cert-manager-csi-driver-spiffe-approver
    namespace: cert-manager
---
apiVersion: v1
kind: Service
metadata:
  name: cert-manager-csi-driver-spiffe-approver-metrics
  namespace: cert-manager
  labels:
    app: cert-manager-csi-driver-spiffe-approver
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
spec:
  type: ClusterIP
  ports:
    - port: 9402
      targetPort: 9402
      protocol: TCP
      name: metrics
  selector:
    app: cert-manager-csi-driver-spiffe-approver
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-manager-csi-driver-spiffe-driver
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
spec:
  selector:
    matchLabels:
      app: cert-manager-csi-driver-spiffe
  template:
    metadata:
      labels:
        app: cert-manager-csi-driver-spiffe
        app.kubernetes.io/name: cert-manager-csi-driver-spiffe
        app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
        app.kubernetes.io/version: "v0.15.1"
      annotations:
        kubectl.kubernetes.io/default-container: cert-manager-csi-driver-spiffe
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cert-manager-csi-driver-spiffe
      containers:
        - name: node-driver-registrar
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          image: "quay.io/jetstack/csi-node-driver-registrar:v2.18.0"
          imagePullPolicy: IfNotPresent
          args:
            - -v=1
            - --csi-address=/plugin/csi.sock
            - --kubelet-registration-path=/var/snap/microk8s/common/var/lib/kubelet/plugins/cert-manager-csi-driver-spiffe/csi.sock
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /plugin
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          image: "quay.io/jetstack/livenessprobe:v2.20.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/plugin/csi.sock
            - --probe-timeout=3s
            - --health-port=9809
            - -v=1
          volumeMounts:
            - name: plugin-dir
              mountPath: /plugin
        - name: cert-manager-csi-driver-spiffe
          securityContext:
            runAsUser: 0
            privileged: true
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          image: "quay.io/jetstack/cert-manager-csi-driver-spiffe:v0.15.1"
          imagePullPolicy: IfNotPresent
          args:
            - --log-level=1
            - --csi-driver-name=spiffe.csi.cert-manager.io
            - --certificate-request-duration=1h
            - --issuer-name=oci-lan-issuer
            - --issuer-kind=ClusterIssuer
            - --issuer-group=cert-manager.io
            - --trust-domain=oci.local
            - --file-name-certificate=tls.crt
            - --file-name-key=tls.key
            - --file-name-ca=ca.crt
            - --source-ca-bundle=
            - --node-id=$(NODE_ID)
            - --endpoint=$(CSI_ENDPOINT)
            - --data-root=csi-data-dir
            - --runtime-issuance-config-map-name=
            - --runtime-issuance-config-map-namespace=cert-manager
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSI_ENDPOINT
              value: unix://plugin/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /plugin
            - name: pods-mount-dir
              mountPath: /var/snap/microk8s/common/var/lib/kubelet/pods
              mountPropagation: "Bidirectional"
            - name: csi-data-dir
              mountPath: /csi-data-dir
          ports:
            - containerPort: 9809
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            timeoutSeconds: 5
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/snap/microk8s/common/var/lib/kubelet/plugins/cert-manager-csi-driver-spiffe
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/snap/microk8s/common/var/lib/kubelet/pods
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/snap/microk8s/common/var/lib/kubelet/plugins_registry
            type: Directory
        - name: csi-data-dir
          hostPath:
            path: /dev/shm/cert-manager-csi-driver-spiffe
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-csi-driver-spiffe-approver
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-manager-csi-driver-spiffe-approver
  template:
    metadata:
      labels:
        app: cert-manager-csi-driver-spiffe-approver
        app.kubernetes.io/name: cert-manager-csi-driver-spiffe
        app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
        app.kubernetes.io/version: "v0.15.1"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cert-manager-csi-driver-spiffe-approver
      containers:
        - name: cert-manager-csi-driver-spiffe-approver
          image: "quay.io/jetstack/cert-manager-csi-driver-spiffe-approver:v0.15.1"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9402
          readinessProbe:
            httpGet:
              port: 6060
              path: "/readyz"
            initialDelaySeconds: 3
            periodSeconds: 7
          args:
            - --log-level=1
            - --csi-driver-name=spiffe.csi.cert-manager.io
            - --certificate-request-duration=1h
            - --issuer-name=oci-lan-issuer
            - --issuer-kind=ClusterIssuer
            - --issuer-group=cert-manager.io
            - --trust-domain=oci.local
            - --runtime-issuance-config-map-name=
            - --runtime-issuance-config-map-namespace=cert-manager
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --metrics-bind-address=:9402
            - --readiness-probe-bind-address=:6060
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: "spiffe.csi.cert-manager.io"
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    app.kubernetes.io/instance: cert-manager-csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.1"
spec:
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
  tokenRequests:
    - audience: ""
      expirationSeconds: 3600
  requiresRepublish: true
