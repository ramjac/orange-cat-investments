apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    owner: emp-human-frank
    app.kubernetes.io/part-of: oci-gateway-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  labels:
    app: envoy-gateway
    control-plane: envoy-gateway
    app.kubernetes.io/part-of: oci-gateway-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-gateway
  labels:
    app: envoy-gateway
    app.kubernetes.io/part-of: oci-gateway-api
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "endpoints", "pods", "secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes", "referencegrants"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status", "grpcroutes/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envoy-gateway
  labels:
    app: envoy-gateway
    app.kubernetes.io/part-of: oci-gateway-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envoy-gateway
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  labels:
    app: envoy-gateway
    control-plane: envoy-gateway
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: envoy-gateway
  template:
    metadata:
      labels:
        app: envoy-gateway
        control-plane: envoy-gateway
    spec:
      serviceAccountName: envoy-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: envoy-gateway
          image: docker.io/envoyproxy/gateway:v1.2.4
          imagePullPolicy: IfNotPresent
          args:
            - server
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ENVOY_GATEWAY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_CLUSTER_DOMAIN
              value: cluster.local
          ports:
            - name: grpc
              containerPort: 18000
              protocol: TCP
            - name: metrics
              containerPort: 19001
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  labels:
    app: envoy-gateway
    control-plane: envoy-gateway
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  selector:
    control-plane: envoy-gateway
  ports:
    - name: grpc
      port: 18000
      targetPort: 18000
      protocol: TCP
    - name: metrics
      port: 19001
      targetPort: 19001
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: oci-gateway-class
  labels:
    owner: emp-human-frank
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: "OCI Zero-Trust Enterprise GatewayClass (Envoy Gateway)"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oci-edge-gateway
  namespace: oci-core
  labels:
    owner: emp-human-frank
    app.kubernetes.io/part-of: oci-gateway-api
  annotations:
    cert-manager.io/cluster-issuer: oci-lan-issuer
spec:
  gatewayClassName: oci-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-core
      protocol: HTTPS
      port: 443
      hostname: "*.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-core-lan-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-root
      protocol: HTTPS
      port: 443
      hostname: "oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-marketing-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-dev
      protocol: HTTPS
      port: 443
      hostname: "dev.*.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-dev-lan-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-sim
      protocol: HTTPS
      port: 443
      hostname: "*.sim.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-sim-lan-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: grpc-tls
      protocol: HTTPS
      port: 8443
      hostname: "auth.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-core-lan-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: GRPCRoute
