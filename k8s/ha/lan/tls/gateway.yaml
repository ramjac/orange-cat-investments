apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: oci-gateway-class
  labels:
    owner: emp-human-frank
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  controllerName: gateway.networking.k8s.io/oci-gateway-controller
  description: "OCI Zero-Trust Enterprise GatewayClass (NGINX Gateway Fabric / Envoy Gateway)"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oci-edge-gateway
  namespace: oci-core
  labels:
    owner: emp-human-frank
    app.kubernetes.io/part-of: oci-gateway-api
  annotations:
    cert-manager.io/cluster-issuer: oci-lan-issuer
spec:
  gatewayClassName: oci-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-core
      protocol: HTTPS
      port: 443
      hostname: "*.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-core-lan-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-root
      protocol: HTTPS
      port: 443
      hostname: "oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-marketing-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-dev
      protocol: HTTPS
      port: 443
      hostname: "dev.*.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-dev-lan-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-sim
      protocol: HTTPS
      port: 443
      hostname: "*.sim.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-sim-lan-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: grpc-tls
      protocol: HTTPS
      port: 8443
      hostname: "auth.oci.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: oci-core-lan-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: GRPCRoute
