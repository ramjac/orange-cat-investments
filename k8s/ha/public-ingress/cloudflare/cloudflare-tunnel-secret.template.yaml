# ==============================================================================
# Cloudflare Tunnel Secret Template
# ==============================================================================
# Generate your tunnel credentials via:
#   cloudflared tunnel create oci-customer-tunnel
# This generates a JSON credentials file located at:
#   ~/.cloudflared/<tunnel-id>.json
#
# Create this secret in your cluster:
#   kubectl create secret generic cloudflare-tunnel-credentials \
#     --namespace oci-core \
#     --from-file=credentials.json=/path/to/<tunnel-id>.json
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: oci-core
type: Opaque
stringData:
  credentials.json: |
    {
      "AccountTag": "your-cloudflare-account-tag-here",
      "TunnelSecret": "your-base64-tunnel-secret-here",
      "TunnelID": "your-tunnel-uuid-here"
    }
