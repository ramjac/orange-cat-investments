# ==============================================================================
# cert-manager ClusterIssuers for Let's Encrypt (ACME)
# ==============================================================================
# Provides automated public TLS certificate issuance and renewal via Let's Encrypt.
# Supports both HTTP-01 (via port 80 Ingress) and DNS-01 (via Cloudflare API).
# ==============================================================================

# Staging Issuer (Use for testing to avoid Let's Encrypt rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@orangecatinvestments.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: public
---
# Production Issuer (Used for valid public browser certificates)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@orangecatinvestments.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # HTTP-01 challenge solver for router port 80 forwarding
      - http01:
          ingress:
            class: public
      # DNS-01 challenge solver (optional alternative if port 80 is blocked by ISP)
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "orangecatinvestments.com"
