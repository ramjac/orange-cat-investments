# ==============================================================================
# Public Gateway API HTTPRoutes for Customer Portal with Let's Encrypt TLS
# ==============================================================================
# Used when directly exposing cluster via router port forwarding (80/443).
# Enforces HTTPS termination via Gateway and security response headers.
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-customer-route
  namespace: oci-core
  labels:
    owner: emp-human-elise
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oci-edge-gateway
      namespace: oci-core
  hostnames:
    - customer.orangecatinvestments.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      timeouts:
        request: 180s
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: X-Content-Type-Options
                value: nosniff
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
      backendRefs:
        - name: oci-customer-bff-service
          port: 8083
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: X-Content-Type-Options
                value: nosniff
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
      backendRefs:
        - name: oci-customer-portal-service
          port: 5174
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-customer-api-route
  namespace: oci-core
  labels:
    owner: emp-human-elise
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oci-edge-gateway
      namespace: oci-core
  hostnames:
    - customer-api.orangecatinvestments.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 180s
      backendRefs:
        - name: oci-customer-bff-service
          port: 8083
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-customer-auth-route
  namespace: oci-core
  labels:
    owner: emp-human-elise
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oci-edge-gateway
      namespace: oci-core
  hostnames:
    - auth.orangecatinvestments.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zitadel-service
          port: 8080
