apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: 'rabbitmq'
        metrics_path: '/metrics/per-object'
        static_configs:
          - targets:
              - 'rabbitmq-service.oci-core.svc.cluster.local:15692'
              - 'rabbitmq-service.oci-dev.svc.cluster.local:15692'

      - job_name: 'forgejo'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['forgejo-service.oci-internal.svc.cluster.local:3000']

      - job_name: 'zitadel'
        metrics_path: '/debug/metrics'
        static_configs:
          - targets:
              - 'zitadel-service.oci-core.svc.cluster.local:8080'
              - 'zitadel-service.oci-dev.svc.cluster.local:8080'

      - job_name: 'meilisearch'
        metrics_path: '/metrics'
        authorization:
          credentials_file: /etc/secrets/meilisearch/MEILI_METRICS_KEY
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: meilisearch
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:7700
            target_label: __address__


      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: 'kubernetes-nodes-kubelet'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: 'nextcloud'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['nextcloud-service.oci-internal.svc.cluster.local:9205']

  alert_rules.yml: |
    groups:
      - name: rabbitmq_queue_alerts
        rules:
          - alert: RabbitMQDeadLetterQueueNotEmpty
            expr: rabbitmq_queue_messages_ready{queue=~".*dlq.*"} > 0
            for: 1m
            labels:
              severity: critical
              tier: messaging
            annotations:
              summary: "RabbitMQ Dead-Letter Queue {{ $labels.queue }} contains unhandled messages"
              description: "DLQ backlog detected on queue {{ $labels.queue }}. Check consumer workers for poison pills or deserialization failures."
          - alert: RabbitMQQueueBacklogSpike
            expr: rabbitmq_queue_messages_ready > 100
            for: 3m
            labels:
              severity: warning
              tier: messaging
            annotations:
              summary: "RabbitMQ Queue {{ $labels.queue }} backlog depth exceeds safe threshold"
              description: "Queue {{ $labels.queue }} has {{ $value }} ready messages pending worker processing."
          - alert: RabbitMQStagnantConsumers
            expr: rabbitmq_queue_consumers == 0 and rabbitmq_queue_messages_ready > 0
            for: 2m
            labels:
              severity: critical
              tier: messaging
            annotations:
              summary: "RabbitMQ Queue {{ $labels.queue }} has zero active consumers with pending messages"
              description: "Worker consumers have disconnected or crashed while messages await consumption."
          - alert: RabbitMQMemoryAlarmActive
            expr: rabbitmq_memory_alarm == 1 or (rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes) > 0.85
            for: 1m
            labels:
              severity: critical
              tier: messaging
            annotations:
              summary: "RabbitMQ node memory saturation alarm active"
              description: "RabbitMQ memory usage exceeds watermark or alarm is active."

      - name: cots_telemetry_alerts
        rules:
          - alert: ForgejoHighLatency
            expr: rate(forgejo_http_request_duration_seconds_sum[5m]) / rate(forgejo_http_request_duration_seconds_count[5m]) > 2
            for: 3m
            labels:
              severity: warning
              tier: cots
            annotations:
              summary: "Forgejo HTTP request latency elevated"
              description: "Forgejo Git and API response latency is exceeding 2 seconds."
          - alert: ZitadelAuthFailureSpike
            expr: rate(zitadel_login_failures_total[5m]) > 5
            for: 2m
            labels:
              severity: warning
              tier: identity
            annotations:
              summary: "ZITADEL authentication failure rate elevated"
              description: "Potential credential stuffing or customer login failures detected in ZITADEL."


      - name: infrastructure_pvc_alerts
        rules:
          - alert: NodeFilesystemLowSpace
            expr: (container_fs_limit_bytes{id="/"} - container_fs_usage_bytes{id="/"}) / container_fs_limit_bytes{id="/"} < 0.2
            for: 5m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "Node filesystem available space < 20%"
              description: "Node {{ $labels.instance }} has less than 20% available space."
          - alert: PVCCapacityWarning
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            for: 5m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} is critically full"
              description: "PVC {{ $labels.persistentvolumeclaim }} on node {{ $labels.instance }} has less than 15% free space remaining."
          - alert: PVCCapacityPrediction
            expr: predict_linear(kubelet_volume_stats_available_bytes[4h], 86400) < 0
            for: 5m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} expected to exhaust space within 24h"
              description: "Linear prediction shows PVC {{ $labels.persistentvolumeclaim }} will run out of space in the next 24 hours based on recent 4h trend."

      - name: kubernetes_object_state_alerts
        rules:
          - alert: PodCrashLoopBackOff
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
            for: 5m
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is in CrashLoopBackOff"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in CrashLoopBackOff for over 5 minutes."
          - alert: PodImagePullBackOff
            expr: kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
            for: 5m
            labels:
              severity: warning
              tier: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is in ImagePullBackOff"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} failed to pull image for over 5 minutes."
          - alert: PodPending
            expr: kube_pod_status_phase{phase="Pending"} == 1
            for: 10m
            labels:
              severity: warning
              tier: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is stuck in Pending state"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been pending for over 10 minutes (unschedulable or unbound PVC)."
          - alert: OOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 1m
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "Container {{ $labels.container }} in Pod {{ $labels.pod }} was OOMKilled"
              description: "Container {{ $labels.container }} in namespace {{ $labels.namespace }} was terminated due to Out-Of-Memory eviction."
          - alert: DeploymentZeroAvailableReplicas
            expr: kube_deployment_status_replicas_available{namespace=~"oci-core|oci-dev|oci-internal|external-sim"} == 0
            for: 30s
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has zero available replicas"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has 0 available replicas for more than 30 seconds."
          - alert: StatefulSetReplicasUnavailable
            expr: kube_statefulset_status_replicas_ready{namespace=~"oci-core|oci-dev|oci-internal"} == 0
            for: 30s
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "StatefulSet {{ $labels.statefulset }} in {{ $labels.namespace }} has zero ready replicas"
              description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has 0 ready replicas for more than 30 seconds."
          - alert: ScrapeTargetDown
            expr: up == 0
            for: 30s
            labels:
              severity: warning
              tier: observability
            annotations:
              summary: "Prometheus scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"
              description: "Target {{ $labels.instance }} in job {{ $labels.job }} has been unreachable for 30 seconds."

      - name: automated_backup_verification
        rules:
          - alert: BackupFailedOrStale
            expr: time() - backup_last_successful_timestamp_seconds > 26 * 3600
            for: 1m
            labels:
              severity: critical
              tier: backup
            annotations:
              summary: "Backup {{ $labels.job }} is stale or failed"
              description: "The last successful backup for {{ $labels.job }} is older than 26 hours. Backup process may be failing silently."

      - name: tls_and_pki_alerts
        rules:
          - alert: CertManagerCertExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (30 * 24 * 3600)
            for: 1h
            labels:
              severity: warning
              tier: pki
            annotations:
              summary: "cert-manager certificate {{ $labels.name }} expires in less than 30 days"
              description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} has less than 30 days before expiration. Verify CARotationManager and cert-manager renewal."
          - alert: BlackboxSSLCertExpiringSoon
            expr: (probe_ssl_earliest_cert_expiry - time()) < (30 * 24 * 3600)
            for: 1h
            labels:
              severity: critical
              tier: control-plane
            annotations:
              summary: "Control plane or Ingress TLS certificate expiring in less than 30 days"
              description: "Target {{ $labels.instance }} SSL/TLS certificate expires in less than 30 days. Execute annual control plane cert rotation SOP."

      - name: valkey_alerts
        rules:
          - alert: ValkeyMemorySaturation
            expr: (redis_memory_used_bytes / redis_memory_max_bytes) > 0.85 and redis_memory_max_bytes > 0
            for: 5m
            labels:
              severity: warning
              tier: cache
            annotations:
              summary: "Valkey memory usage exceeds 85% of maxmemory on {{ $labels.instance }}"
              description: "Valkey instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of configured maxmemory."
          - alert: ValkeyKeyEvictions
            expr: increase(redis_evicted_keys_total[5m]) > 0
            for: 2m
            labels:
              severity: warning
              tier: cache
            annotations:
              summary: "Valkey is evicting keys on {{ $labels.instance }}"
              description: "Valkey instance {{ $labels.instance }} evicted {{ $value }} keys in the last 5 minutes. Sessions or cached tokens may be prematurely dropped."

      - name: postgresql_alerts
        rules:
          - alert: PostgresConnectionSaturation
            expr: (sum by (instance) (pg_stat_activity_count) / pg_settings_max_connections) > 0.80
            for: 5m
            labels:
              severity: warning
              tier: database
            annotations:
              summary: "PostgreSQL connection usage exceeds 80% on {{ $labels.instance }}"
              description: "PostgreSQL instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of max_connections."
          - alert: PostgresDeadTupleBloat
            expr: pg_stat_user_tables_n_dead_tup > 10000 and (pg_stat_user_tables_n_dead_tup / (pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup + 1)) > 0.20
            for: 15m
            labels:
              severity: warning
              tier: database
            annotations:
              summary: "PostgreSQL table {{ $labels.relname }} has high dead tuple bloat"
              description: "Table {{ $labels.schemaname }}.{{ $labels.relname }} in database {{ $labels.datname }} has > 10,000 dead tuples and > 20% dead tuple ratio. Autovacuum may be lagging."
          - alert: PostgresXIDWraparoundRisk
            expr: pg_database_age > 1500000000
            for: 5m
            labels:
              severity: critical
              tier: database
            annotations:
              summary: "PostgreSQL database {{ $labels.datname }} approaching XID wraparound"
              description: "Database {{ $labels.datname }} on {{ $labels.instance }} has transaction ID age {{ $value }} (> 1.5B). Immediate vacuum freeze required to prevent database shutdown."
          - alert: PostgresLowCacheHitRatio
            expr: (sum by (instance, datname) (rate(pg_stat_database_blks_hit[5m])) / (sum by (instance, datname) (rate(pg_stat_database_blks_hit[5m])) + sum by (instance, datname) (rate(pg_stat_database_blks_read[5m])))) < 0.99 and (sum by (instance, datname) (rate(pg_stat_database_blks_hit[5m])) + sum by (instance, datname) (rate(pg_stat_database_blks_read[5m]))) > 0
            for: 10m
            labels:
              severity: warning
              tier: database
            annotations:
              summary: "PostgreSQL cache hit ratio below 99% on {{ $labels.datname }}"
              description: "Database {{ $labels.datname }} on {{ $labels.instance }} has a shared buffer cache hit ratio of {{ $value | humanizePercentage }} over the last 5m."

      - name: meilisearch_alerts
        rules:
          - alert: MeilisearchDown
            expr: up{job="meilisearch"} == 0 or kube_deployment_status_replicas_available{deployment="meilisearch",namespace=~"oci-core|oci-dev"} == 0
            for: 1m
            labels:
              severity: critical
              tier: search
            annotations:
              summary: "Meilisearch search engine is down ({{ $labels.namespace }}/{{ $labels.instance }})"
              description: "Meilisearch is down or has zero available replicas. Search queries will fail."
          - alert: MeilisearchDiskUsageHigh
            expr: (kubelet_volume_stats_used_bytes{persistentvolumeclaim="meilisearch-data-pvc"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="meilisearch-data-pvc"}) > 0.80
            for: 5m
            labels:
              severity: warning
              tier: search
            annotations:
              summary: "Meilisearch PVC {{ $labels.persistentvolumeclaim }} disk usage > 80%"
              description: "Meilisearch data volume in namespace {{ $labels.namespace }} is at {{ $value | humanizePercentage }} capacity."

      - name: service_and_upstream_error_alerts
        rules:
          - alert: HighHTTP5xxErrorRate
            expr: sum by (job, service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[2m])) > 0.05
            for: 30s
            labels:
              severity: warning
              tier: application
            annotations:
              summary: "Elevated HTTP 5xx error rate on {{ $labels.service_name }}"
              description: "Service {{ $labels.service_name }} is returning HTTP 5xx responses at {{ $value }} req/s over the last 2m."
          - alert: UpstreamBankOrBrokerErrorSpike
            expr: sum by (service, status) (rate(oci_upstream_requests_total{status=~"unavailable|rejected"}[2m])) > 0
            for: 30s
            labels:
              severity: critical
              tier: upstream
            annotations:
              summary: "Upstream {{ $labels.service }} errors detected ({{ $labels.status }})"
              description: "Outbound requests to upstream {{ $labels.service }} are failing with status={{ $labels.status }}."
          - alert: UpstreamBankOrBrokerTimeoutSpike
            expr: sum by (service) (rate(oci_upstream_requests_total{status="timeout"}[2m])) > 0
            for: 30s
            labels:
              severity: critical
              tier: upstream
            annotations:
              summary: "Upstream {{ $labels.service }} request timeouts detected"
              description: "Outbound requests to upstream {{ $labels.service }} are exceeding the configured deadline."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=3d"
            - "--storage.tsdb.retention.size=2GB"
            - "--web.enable-remote-write-receiver"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
            - name: meili-secret
              mountPath: /etc/secrets/meilisearch
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
        - name: meili-secret
          secret:
            secretName: meili-metrics-secret
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: prometheus
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
