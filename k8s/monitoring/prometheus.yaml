apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod

      - job_name: 'rabbitmq'
        metrics_path: '/metrics/per-object'
        static_configs:
          - targets: ['rabbitmq-service.oci-core.svc.cluster.local:15692']

      - job_name: 'forgejo'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['forgejo-service.oci-internal.svc.cluster.local:3000']

      - job_name: 'zitadel'
        metrics_path: '/debug/metrics'
        static_configs:
          - targets: ['zitadel-service.oci-core.svc.cluster.local:8080']


      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: 'kubernetes-nodes-kubelet'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: 'nextcloud'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['nextcloud-service.oci-internal.svc.cluster.local:9205']

  alert_rules.yml: |
    groups:
      - name: rabbitmq_queue_alerts
        rules:
          - alert: RabbitMQDeadLetterQueueNotEmpty
            expr: rabbitmq_queue_messages_ready{queue=~".*dlq.*"} > 0
            for: 1m
            labels:
              severity: critical
              tier: messaging
            annotations:
              summary: "RabbitMQ Dead-Letter Queue {{ $labels.queue }} contains unhandled messages"
              description: "DLQ backlog detected on queue {{ $labels.queue }}. Check consumer workers for poison pills or deserialization failures."
          - alert: RabbitMQQueueBacklogSpike
            expr: rabbitmq_queue_messages_ready > 100
            for: 3m
            labels:
              severity: warning
              tier: messaging
            annotations:
              summary: "RabbitMQ Queue {{ $labels.queue }} backlog depth exceeds safe threshold"
              description: "Queue {{ $labels.queue }} has {{ $value }} ready messages pending worker processing."
          - alert: RabbitMQStagnantConsumers
            expr: rabbitmq_queue_consumers == 0 and rabbitmq_queue_messages_ready > 0
            for: 2m
            labels:
              severity: critical
              tier: messaging
            annotations:
              summary: "RabbitMQ Queue {{ $labels.queue }} has zero active consumers with pending messages"
              description: "Worker consumers have disconnected or crashed while messages await consumption."
          - alert: RabbitMQMemoryAlarmActive
            expr: rabbitmq_memory_alarm == 1 or (rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes) > 0.85
            for: 1m
            labels:
              severity: critical
              tier: messaging
            annotations:
              summary: "RabbitMQ node memory saturation alarm active"
              description: "RabbitMQ memory usage exceeds watermark or alarm is active."

      - name: cots_telemetry_alerts
        rules:
          - alert: ForgejoHighLatency
            expr: rate(forgejo_http_request_duration_seconds_sum[5m]) / rate(forgejo_http_request_duration_seconds_count[5m]) > 2
            for: 3m
            labels:
              severity: warning
              tier: cots
            annotations:
              summary: "Forgejo HTTP request latency elevated"
              description: "Forgejo Git and API response latency is exceeding 2 seconds."
          - alert: ZitadelAuthFailureSpike
            expr: rate(zitadel_login_failures_total[5m]) > 5
            for: 2m
            labels:
              severity: warning
              tier: identity
            annotations:
              summary: "ZITADEL authentication failure rate elevated"
              description: "Potential credential stuffing or customer login failures detected in ZITADEL."


      - name: infrastructure_pvc_alerts
        rules:
          - alert: PVCCapacityWarning
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            for: 5m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} is critically full"
              description: "PVC {{ $labels.persistentvolumeclaim }} on node {{ $labels.instance }} has less than 15% free space remaining."
          - alert: PVCCapacityPrediction
            expr: predict_linear(kubelet_volume_stats_available_bytes[4h], 86400) < 0
            for: 5m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} expected to exhaust space within 24h"
              description: "Linear prediction shows PVC {{ $labels.persistentvolumeclaim }} will run out of space in the next 24 hours based on recent 4h trend."

      - name: kubernetes_object_state_alerts
        rules:
          - alert: PodCrashLoopBackOff
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
            for: 5m
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is in CrashLoopBackOff"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in CrashLoopBackOff for over 5 minutes."
          - alert: PodImagePullBackOff
            expr: kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
            for: 5m
            labels:
              severity: warning
              tier: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is in ImagePullBackOff"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} failed to pull image for over 5 minutes."
          - alert: PodPending
            expr: kube_pod_status_phase{phase="Pending"} == 1
            for: 10m
            labels:
              severity: warning
              tier: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is stuck in Pending state"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been pending for over 10 minutes (unschedulable or unbound PVC)."
          - alert: OOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 1m
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "Container {{ $labels.container }} in Pod {{ $labels.pod }} was OOMKilled"
              description: "Container {{ $labels.container }} in namespace {{ $labels.namespace }} was terminated due to Out-Of-Memory eviction."

      - name: automated_backup_verification
        rules:
          - alert: BackupFailedOrStale
            expr: time() - backup_last_successful_timestamp_seconds > 26 * 3600
            for: 1m
            labels:
              severity: critical
              tier: backup
            annotations:
              summary: "Backup {{ $labels.job }} is stale or failed"
              description: "The last successful backup for {{ $labels.job }} is older than 26 hours. Backup process may be failing silently."

      - name: tls_and_pki_alerts
        rules:
          - alert: CertManagerCertExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (30 * 24 * 3600)
            for: 1h
            labels:
              severity: warning
              tier: pki
            annotations:
              summary: "cert-manager certificate {{ $labels.name }} expires in less than 30 days"
              description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} has less than 30 days before expiration. Verify CARotationManager and cert-manager renewal."
          - alert: BlackboxSSLCertExpiringSoon
            expr: (probe_ssl_earliest_cert_expiry - time()) < (30 * 24 * 3600)
            for: 1h
            labels:
              severity: critical
              tier: control-plane
            annotations:
              summary: "Control plane or Ingress TLS certificate expiring in less than 30 days"
              description: "Target {{ $labels.instance }} SSL/TLS certificate expires in less than 30 days. Execute annual control plane cert rotation SOP."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: prometheus
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
