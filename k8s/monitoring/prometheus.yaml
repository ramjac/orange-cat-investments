apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod

  alert_rules.yml: |
    groups:
      - name: tls_and_pki_alerts
        rules:
          - alert: CertManagerCertExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (30 * 24 * 3600)
            for: 1h
            labels:
              severity: warning
              tier: pki
            annotations:
              summary: "cert-manager certificate {{ $labels.name }} expires in less than 30 days"
              description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} has less than 30 days before expiration. Verify CARotationManager and cert-manager renewal."
          - alert: BlackboxSSLCertExpiringSoon
            expr: (probe_ssl_earliest_cert_expiry - time()) < (30 * 24 * 3600)
            for: 1h
            labels:
              severity: critical
              tier: control-plane
            annotations:
              summary: "Control plane or Ingress TLS certificate expiring in less than 30 days"
              description: "Target {{ $labels.instance }} SSL/TLS certificate expires in less than 30 days. Execute annual control plane cert rotation SOP."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: prometheus
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
