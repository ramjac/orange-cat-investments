# Scheduled Batch Jobs for Orange Cat Investments (OCI)
# 1. Recurring ACH Deposit Batch Processor (Runs daily at midnight UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recurring-ach-processor
  namespace: oci-core
  labels:
    app: recurring-ach-processor
    tier: batch
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: recurring-ach-processor
            tier: batch
        spec:
          restartPolicy: OnFailure
          containers:
            - name: processor
              image: localhost:32000/oci-worker:latest
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/oci-worker"]
              env:
                - name: ENABLE_CORE_INVEST
                  value: "true"
                - name: CUSTOMER_BLL_URL
                  value: "https://customer-bll-service.oci-core.svc.cluster.local:8085"
                - name: BATCH_MODE
                  value: "ach-recurring"
                - name: RABBITMQ_URL
                  value: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-core.svc.cluster.local:5672/"
                - name: TLS_CERT_FILE
                  value: "/etc/tls/certs/tls.crt"
                - name: TLS_KEY_FILE
                  value: "/etc/tls/certs/tls.key"
                - name: CLIENT_CA_FILE
                  value: "/etc/tls/ca/ca.crt"
              volumeMounts:
                - name: tls-certs
                  mountPath: /etc/tls/certs
                  readOnly: true
                - name: ca-cert
                  mountPath: /etc/tls/ca
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: tls-certs
              secret:
                secretName: oci-worker-tls-certs
            - name: ca-cert
              configMap:
                name: oci-ca-bundle
                optional: true
---
# 2. Automated End-of-Month Statement & Tax Batch Generator (Runs 1st of each month at 01:00 UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eom-statement-generator
  namespace: oci-core
  labels:
    app: eom-statement-generator
    tier: batch
spec:
  schedule: "0 1 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: eom-statement-generator
            tier: batch
        spec:
          restartPolicy: OnFailure
          containers:
            - name: generator
              image: localhost:32000/oci-worker:latest
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/oci-worker"]
              env:
                - name: ENABLE_CORE_INVEST
                  value: "true"
                - name: CUSTOMER_BLL_URL
                  value: "https://customer-bll-service.oci-core.svc.cluster.local:8085"
                - name: BATCH_MODE
                  value: "eom-statements"
                - name: RABBITMQ_URL
                  value: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-core.svc.cluster.local:5672/"
                - name: TLS_CERT_FILE
                  value: "/etc/tls/certs/tls.crt"
                - name: TLS_KEY_FILE
                  value: "/etc/tls/certs/tls.key"
                - name: CLIENT_CA_FILE
                  value: "/etc/tls/ca/ca.crt"
              volumeMounts:
                - name: tls-certs
                  mountPath: /etc/tls/certs
                  readOnly: true
                - name: ca-cert
                  mountPath: /etc/tls/ca
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: tls-certs
              secret:
                secretName: oci-worker-tls-certs
            - name: ca-cert
              configMap:
                name: oci-ca-bundle
                optional: true
