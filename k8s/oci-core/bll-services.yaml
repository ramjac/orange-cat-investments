# Customer Business Logic Layer (Customer BLL) API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-bll
  namespace: oci-core
  labels:
    app: customer-bll
    tier: bll
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-bll
  namespace: oci-core
  labels:
    app: customer-bll
    tier: bll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-bll
  template:
    metadata:
      labels:
        app: customer-bll
        tier: bll
    spec:
      serviceAccountName: customer-bll
      securityContext:
        supplementalGroups: [65532]
      containers:
        - name: customer-bll
          image: localhost:32000/customer-bll:prod-stable
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: PORT
              value: "8085"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKFORCE_API_URL
              value: "https://workforce-api-service.oci-core.svc.cluster.local:50051"
            - name: CORE_INVEST_API_URL
              value: "https://core-invest-api-service.oci-core.svc.cluster.local:50053"
            - name: OPS_API_URL
              value: "https://ops-api-service.oci-core.svc.cluster.local:50054"
            - name: BROKER_API_BASE_URL
              value: "http://mock-broker-service.external-sim.svc.cluster.local:8089"
            - name: BANK_API_BASE_URL
              value: "http://mock-bank-service.external-sim.svc.cluster.local:8088"
            - name: APCA_API_KEY_ID
              value: "CK_OCI_TEST_KEY_01"
            - name: APCA_API_SECRET_KEY
              value: "SK_OCI_TEST_SECRET_01"
            - name: PLAID_CLIENT_ID
              value: "client_oci_sim_01"
            - name: PLAID_SECRET
              value: "sec_oci_sim_test_8829"
            - name: RABBITMQ_URL
              value: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-core.svc.cluster.local:5672/"
            - name: DEFAULT_FELINE_ID
              value: "" # Optional default employee override; dynamically queried from workforce API if unset
            - name: BLOBSTORE_ENDPOINT
              value: "http://garage-service.oci-core.svc.cluster.local:3900"
            - name: BLOBSTORE_PUBLIC_ENDPOINT
              value: "http://s3.oci.local"
            - name: BLOBSTORE_REGION
              value: "garage"
            - name: BLOBSTORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: BLOBSTORE_ACCESS_KEY
                  optional: true
            - name: BLOBSTORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: BLOBSTORE_SECRET_KEY
                  optional: true
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/etc/tls/ca/ca.crt"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              spiffe.csi.cert-manager.io/fs-group: "65532"
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: customer-bll-service
  namespace: oci-core
  labels:
    app: customer-bll
    tier: bll
spec:
  ports:
    - port: 8085
      targetPort: 8085
      name: http
  selector:
    app: customer-bll
---
