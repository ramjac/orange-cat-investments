# Customer Business Logic Layer (Customer BLL) API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-bll
  namespace: oci-core
  labels:
    app: customer-bll
    tier: bll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-bll
  template:
    metadata:
      labels:
        app: customer-bll
        tier: bll
    spec:
      containers:
        - name: customer-bll
          image: localhost:32000/customer-bll:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: PORT
              value: "8085"
            - name: WORKFORCE_API_URL
              value: "http://workforce-api-service.oci-core.svc.cluster.local:50051"
            - name: CORE_INVEST_API_URL
              value: "http://core-invest-api-service.oci-core.svc.cluster.local:50053"
            - name: BROKER_API_BASE_URL
              value: "http://mock-broker-service.external-sim.svc.cluster.local:8089"
            - name: BANK_API_BASE_URL
              value: "http://mock-bank-service.external-sim.svc.cluster.local:8088"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: customer-bll-service
  namespace: oci-core
  labels:
    app: customer-bll
    tier: bll
spec:
  ports:
    - port: 8085
      targetPort: 8085
      name: http
  selector:
    app: customer-bll
---
# Internal Business Logic Layer (Internal BLL) API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-bll
  namespace: oci-core
  labels:
    app: internal-bll
    tier: bll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-bll
  template:
    metadata:
      labels:
        app: internal-bll
        tier: bll
    spec:
      containers:
        - name: internal-bll
          image: localhost:32000/internal-bll:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: PORT
              value: "8086"
            - name: WORKFORCE_API_URL
              value: "http://workforce-api-service.oci-core.svc.cluster.local:50051"
            - name: FACILITIES_API_URL
              value: "http://facilities-api-service.oci-core.svc.cluster.local:50052"
            - name: OPS_API_URL
              value: "http://ops-api-service.oci-core.svc.cluster.local:50054"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: internal-bll-service
  namespace: oci-core
  labels:
    app: internal-bll
    tier: bll
spec:
  ports:
    - port: 8086
      targetPort: 8086
      name: http
  selector:
    app: internal-bll
---
# NetworkPolicy: Restrict Ingress to BLL services to BFF pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bll-services-network-policy
  namespace: oci-core
spec:
  podSelector:
    matchLabels:
      tier: bll
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oci-customer-bff
        - podSelector:
            matchLabels:
              app: oci-employee-bff
      ports:
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
