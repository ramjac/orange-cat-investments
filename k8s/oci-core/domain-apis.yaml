# NetworkPolicy: Restrict Ingress to Domain APIs strictly to BLL and Worker pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: domain-apis-network-policy
  namespace: oci-core
spec:
  podSelector:
    matchLabels:
      tier: domain-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: bll
        - podSelector:
            matchLabels:
              app: oci-worker
        - podSelector:
            matchLabels:
              app: oci-server
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
