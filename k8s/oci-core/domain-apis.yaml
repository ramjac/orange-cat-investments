# Workforce Domain API (Port 50051)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-api
  namespace: oci-core
  labels:
    app: workforce-api
    tier: domain-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workforce-api
  template:
    metadata:
      labels:
        app: workforce-api
        tier: domain-api
    spec:
      containers:
        - name: workforce-api
          image: localhost:32000/workforce-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc-http
          env:
            - name: PORT
              value: "50051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: DATABASE_URL
            - name: ENABLE_FELINE_WORKFORCE
              value: "true"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/etc/tls/ca/ca.crt"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 50051
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 50051
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          secret:
            secretName: workforce-api-tls-certs
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: workforce-api-tls
  namespace: oci-core
spec:
  secretName: workforce-api-tls-certs
  issuerRef:
    name: oci-lan-issuer
    kind: ClusterIssuer
  commonName: workforce-api-service.oci-core.svc.cluster.local
  dnsNames:
    - workforce-api-service
    - workforce-api-service.oci-core.svc
    - workforce-api-service.oci-core.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: workforce-api-service
  namespace: oci-core
  labels:
    app: workforce-api
    tier: domain-api
spec:
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc-http
  selector:
    app: workforce-api
---
