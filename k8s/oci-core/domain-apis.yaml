# Workforce Domain API (Port 50051)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-api
  namespace: oci-core
  labels:
    app: workforce-api
    tier: domain-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workforce-api
  template:
    metadata:
      labels:
        app: workforce-api
        tier: domain-api
    spec:
      containers:
        - name: workforce-api
          image: localhost:32000/workforce-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc-http
          env:
            - name: PORT
              value: "50051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: DATABASE_URL
            - name: ENABLE_FELINE_WORKFORCE
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workforce-api-service
  namespace: oci-core
  labels:
    app: workforce-api
    tier: domain-api
spec:
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc-http
  selector:
    app: workforce-api
---
