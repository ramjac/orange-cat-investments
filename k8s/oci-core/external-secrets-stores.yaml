# External Secrets Operator ClusterSecretStore pointing to OpenBao KV-v2
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-kv-store
spec:
  provider:
    vault:
      server: "http://openbao-service.oci-core.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-reader"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
