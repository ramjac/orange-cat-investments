# Namespace-scoped External Secrets Operator SecretStores pointing to OpenBao KV-v2
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store-sa
  namespace: oci-core
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-kv-store
  namespace: oci-core
spec:
  provider:
    vault:
      server: "http://openbao-service.oci-core.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-core-reader"
          serviceAccountRef:
            name: "eso-store-sa"
---
