apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-marketing
  namespace: oci-core
  labels:
    app: oci-marketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-marketing
  template:
    metadata:
      labels:
        app: oci-marketing
    spec:
      containers:
        - name: oci-marketing
          image: localhost:32000/oci-marketing:prod-stable
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oci-marketing-service
  namespace: oci-core
  labels:
    app: oci-marketing
spec:
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: oci-marketing
