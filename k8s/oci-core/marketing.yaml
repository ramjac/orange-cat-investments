apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-marketing
  namespace: oci-core
  labels:
    app: oci-marketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-marketing
  template:
    metadata:
      labels:
        app: oci-marketing
    spec:
      containers:
        - name: oci-marketing
          image: localhost:32000/oci-marketing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oci-marketing-service
  namespace: oci-core
  labels:
    app: oci-marketing
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: oci-marketing
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oci-marketing-ingress
  namespace: oci-core
  annotations:
    cert-manager.io/cluster-issuer: oci-lan-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - oci.local
        - www.oci.local
      secretName: oci-marketing-tls
  rules:
    - host: oci.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oci-marketing-service
                port:
                  number: 80
    - host: www.oci.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oci-marketing-service
                port:
                  number: 80
