apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-data-pvc
  namespace: oci-core
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: oci-core
  labels:
    app: meilisearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.7
          ports:
            - containerPort: 7700
              name: http
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: MEILI_MASTER_KEY
            - name: MEILI_ENV
              value: production
            - name: MEILI_EXPERIMENTAL_ENABLE_METRICS
              value: "true"
          volumeMounts:
            - name: meilisearch-storage
              mountPath: /meili_data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: meilisearch-storage
          persistentVolumeClaim:
            claimName: meilisearch-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch-service
  namespace: oci-core
  labels:
    app: meilisearch
spec:
  ports:
    - port: 7700
      targetPort: 7700
      name: http
  selector:
    app: meilisearch
