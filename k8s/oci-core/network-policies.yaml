    matchLabels:
      tier: bll
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: bff
        - podSelector:
            matchLabels:
              tier: batch
        - podSelector:
            matchLabels:
              app: oci-worker
        - podSelector:
            matchLabels:
              app: oci-pebble-proxy
      ports:
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-sim
          podSelector:
            matchLabels:
              app: mock-hardware
      ports:
        - protocol: TCP
          port: 8086
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: domain-api
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: meilisearch
      ports:
        - protocol: TCP
          port: 7700
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oci-internal
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-sim
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - mock-bank
                  - mock-broker
      ports:
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8089
---
# Tier 4: Domain APIs (workforce-api, facilities-api, core-invest-api, ops-api)
# Invariant: Strictly Ingress from BLLs; strictly Egress to postgres-core:5432; zero east-west paths
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: domain-apis-network-policy
  namespace: oci-core
spec:
  podSelector:
    matchLabels:
      tier: domain-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: bll
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-core
      ports:
        - protocol: TCP
          port: 5432
---
