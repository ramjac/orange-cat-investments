apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-customer-bff
  namespace: oci-core
  labels:
    app: oci-customer-bff
    tier: bff
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-customer-bff
  namespace: oci-core
  labels:
    app: oci-customer-bff
    tier: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-customer-bff
  template:
    metadata:
      labels:
        app: oci-customer-bff
        tier: bff
    spec:
      serviceAccountName: oci-customer-bff
      securityContext:
        supplementalGroups: [65532]
      containers:
        - name: oci-customer-bff
          image: localhost:32000/oci-customer-bff:prod-stable
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PORT
              value: "8083"
            - name: ENV
              value: "production"
            - name: VALKEY_ADDR
              value: "valkey-service.oci-core.svc.cluster.local:6379"
            - name: SEED_DEV_SESSIONS
              value: "false"
            - name: CUSTOMER_BLL_URL
              value: "https://customer-bll-service.oci-core.svc.cluster.local:8085"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CA_CERT_FILE
              value: "/etc/tls/ca/ca.crt"
            - name: TURN_SERVER_HOST
              value: "turn.oci.local:3478"
            - name: TURN_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: TURN_AUTH_SECRET
                  optional: false
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              spiffe.csi.cert-manager.io/fs-group: "65532"
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: oci-customer-bff-service
  namespace: oci-core
  labels:
    app: oci-customer-bff
spec:
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app: oci-customer-bff
