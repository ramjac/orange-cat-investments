apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-customer-bff
  namespace: oci-core
  labels:
    app: oci-customer-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-customer-bff
  template:
    metadata:
      labels:
        app: oci-customer-bff
    spec:
      containers:
        - name: oci-customer-bff
          image: localhost:32000/oci-customer-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PORT
              value: "8083"
            - name: ENV
              value: "production"
            - name: VALKEY_ADDR
              value: "valkey-service.oci-core.svc.cluster.local:6379"
            - name: SEED_DEV_SESSIONS
              value: "false"
            - name: CUSTOMER_BLL_URL
              value: "https://customer-bll-service.oci-core.svc.cluster.local:8085"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CA_CERT_FILE
              value: "/etc/tls/ca/ca.crt"
            - name: ALPACA_BASE_URL
              value: "http://mock-broker-service.external-sim.svc.cluster.local:8089"
            - name: ALPACA_DATA_URL
              value: "http://mock-broker-service.external-sim.svc.cluster.local:8089"
            - name: APCA_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: APCA_API_KEY_ID
            - name: APCA_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: APCA_API_SECRET_KEY
            - name: BANK_API_BASE_URL
              value: "http://mock-bank-service.external-sim.svc.cluster.local:8088"
            - name: PLAID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: PLAID_CLIENT_ID
            - name: PLAID_SECRET
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: PLAID_SECRET
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          secret:
            secretName: oci-customer-bff-tls-certs
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oci-customer-bff-tls
  namespace: oci-core
spec:
  secretName: oci-customer-bff-tls-certs
  issuerRef:
    name: oci-lan-issuer
    kind: ClusterIssuer
  commonName: oci-customer-bff-service.oci-core.svc.cluster.local
  dnsNames:
    - oci-customer-bff-service
    - oci-customer-bff-service.oci-core.svc
    - oci-customer-bff-service.oci-core.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: oci-customer-bff-service
  namespace: oci-core
  labels:
    app: oci-customer-bff
spec:
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app: oci-customer-bff
