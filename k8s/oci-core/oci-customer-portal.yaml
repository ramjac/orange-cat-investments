apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-customer-portal
  namespace: oci-core
  labels:
    app: oci-customer-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-customer-portal
  template:
    metadata:
      labels:
        app: oci-customer-portal
    spec:
      containers:
        - name: oci-customer-portal
          image: localhost:32000/oci-customer-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5174
              name: http
          env:
            - name: PORT
              value: "5174"
            - name: STATIC_DIR
              value: "/dist"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5174
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5174
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oci-customer-portal-service
  namespace: oci-core
  labels:
    app: oci-customer-portal
spec:
  ports:
    - port: 5174
      targetPort: 5174
      name: http
  selector:
    app: oci-customer-portal
