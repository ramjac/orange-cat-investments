apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-pebble-proxy
  namespace: oci-core
  labels:
    app: oci-pebble-proxy
    tier: bff
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-pebble-proxy
  namespace: oci-core
  labels:
    app: oci-pebble-proxy
    tier: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-pebble-proxy
  template:
    metadata:
      labels:
        app: oci-pebble-proxy
        tier: bff
    spec:
      serviceAccountName: oci-pebble-proxy
      securityContext:
        supplementalGroups: [65532]
      containers:
        - name: oci-pebble-proxy
          image: localhost:32000/oci-pebble-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PORT
              value: "8082"
            - name: ENABLE_PEBBLE_GATEWAY
              value: "true"
            - name: INTERNAL_BLL_URL
              value: "https://internal-bll-service.oci-core.svc.cluster.local:8086"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/etc/tls/ca/ca.crt"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              spiffe.csi.cert-manager.io/fs-group: "65532"
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: oci-pebble-proxy-service
  namespace: oci-core
  labels:
    app: oci-pebble-proxy
    tier: bff
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: oci-pebble-proxy
