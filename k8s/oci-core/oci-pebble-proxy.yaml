apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-pebble-proxy
  namespace: oci-core
  labels:
    app: oci-pebble-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-pebble-proxy
  template:
    metadata:
      labels:
        app: oci-pebble-proxy
    spec:
      containers:
        - name: oci-pebble-proxy
          image: localhost:32000/oci-pebble-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PORT
              value: "8082"
            - name: ENABLE_PEBBLE_GATEWAY
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oci-pebble-proxy-service
  namespace: oci-core
  labels:
    app: oci-pebble-proxy
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: oci-pebble-proxy
