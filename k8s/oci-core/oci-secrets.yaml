# Dynamic & KV-v2 ExternalSecrets for oci-core (7.20c / 7.20d)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-core-secrets
  namespace: oci-core
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-kv-store
    kind: ClusterSecretStore
  target:
    name: oci-core-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: oci-core/config
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: workforce-db-creds
  namespace: oci-core
spec:
  path: "database/creds/workforce-core"
  method: "GET"
  resultType: "Data"
  provider:
    server: "http://openbao-service.oci-core.svc.cluster.local:8200"
    auth:
      kubernetes:
        mountPath: "kubernetes"
        role: "eso-reader"
        serviceAccountRef:
          name: "workforce-api"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workforce-db-secret
  namespace: oci-core
spec:
  refreshInterval: "1h"
  target:
    name: workforce-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@postgres-core-service.oci-core.svc.cluster.local:5432/oci?sslmode=disable"
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: workforce-db-creds
---
