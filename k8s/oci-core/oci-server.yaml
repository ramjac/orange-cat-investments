apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-server
  namespace: oci-core
  labels:
    app: oci-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-server
  template:
    metadata:
      labels:
        app: oci-server
    spec:
      containers:
        - name: oci-server
          image: localhost:32000/oci-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: DATABASE_URL
            - name: ENABLE_CORE_INVEST
              value: "true"
            - name: ENABLE_PEBBLE_GATEWAY
              value: "true"
            - name: ENABLE_FELINE_WORKFORCE
              value: "true"
            - name: ALPACA_BASE_URL
              value: "http://mock-broker-service.external-sim.svc.cluster.local:8089"
            - name: ALPACA_DATA_URL
              value: "http://mock-broker-service.external-sim.svc.cluster.local:8089"
            - name: APCA_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: APCA_API_KEY_ID
            - name: APCA_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: APCA_API_SECRET_KEY
            - name: BANK_API_BASE_URL
              value: "http://mock-bank-service.external-sim.svc.cluster.local:8088"
            - name: PLAID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: PLAID_CLIENT_ID
            - name: PLAID_SECRET
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: PLAID_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oci-server-service
  namespace: oci-core
  labels:
    app: oci-server
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: oci-server
