apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-worker
  namespace: oci-core
  labels:
    app: oci-worker
    tier: worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-worker
  namespace: oci-core
  labels:
    app: oci-worker
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-worker
  template:
    metadata:
      labels:
        app: oci-worker
        tier: worker
    spec:
      serviceAccountName: oci-worker
      securityContext:
        supplementalGroups: [65532]
      containers:
        - name: oci-worker
          image: localhost:32000/oci-worker:prod-stable
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: health
          env:
            - name: ENABLE_CORE_INVEST
              value: "true"
            - name: ENABLE_FELINE_WORKFORCE
              value: "true"
            - name: HEALTH_PORT
              value: "8080"
            - name: CUSTOMER_BLL_URL
              value: "https://customer-bll-service.oci-core.svc.cluster.local:8085"
            - name: INTERNAL_BLL_URL
              value: "https://internal-bll-service.oci-core.svc.cluster.local:8086"
            - name: EMPLOYEE_BFF_URL
              value: "http://oci-employee-bff-service.oci-core.svc.cluster.local:8081"
            - name: PEBBLE_PROXY_URL
              value: "http://oci-pebble-proxy-service.oci-core.svc.cluster.local:8082"
            - name: RABBITMQ_URL
              value: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-core.svc.cluster.local:5672/"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/etc/tls/ca/ca.crt"
            - name: CA_CERT_PATH
              value: "/etc/oci/tls/ca.crt"
            - name: CA_KEY_PATH
              value: "/etc/oci/tls/ca.key"
            - name: COSIGN_PUB_KEY_FILE
              value: "/etc/oci/cosign/cosign.pub"
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: INTERNAL_SERVICE_KEY
                  optional: true
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/oci/tls
              readOnly: true
            - name: cosign-pub
              mountPath: /etc/oci/cosign
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              spiffe.csi.cert-manager.io/fs-group: "65532"
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
        - name: ca-bundle
          configMap:
            name: oci-ca-bundle
            optional: true
        - name: cosign-pub
          configMap:
            name: oci-cosign-pub
            optional: true
