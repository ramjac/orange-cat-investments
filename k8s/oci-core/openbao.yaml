# OpenBao (Secrets Management & Dynamic PostgreSQL Engine) in oci-core
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: oci-core
  labels:
    app: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-delegator
  labels:
    app: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: oci-core
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: oci-core
  labels:
    app: openbao
data:
  config.hcl: |
    ui            = true
    disable_mlock = true

    storage "file" {
      path = "/openbao/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    api_addr = "http://openbao-service.oci-core.svc.cluster.local:8200"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data-pvc
  namespace: oci-core
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: oci-core
  labels:
    app: openbao
spec:
  serviceName: openbao-service
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      serviceAccountName: openbao
      initContainers:
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /openbao/data"]
          volumeMounts:
            - name: openbao-data
              mountPath: /openbao/data
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:2.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
          command:
            - /bin/sh
            - -ec
            - |
              bao server -config=/openbao/config/config.hcl &
              SERVER_PID=$!
              if [ -s /openbao/unseal/unseal_key ]; then
                for i in $(seq 1 30); do
                  if bao status >/dev/null 2>&1 || [ $? -eq 2 ]; then
                    bao operator unseal "$(cat /openbao/unseal/unseal_key)" >/dev/null 2>&1 || true
                    break
                  fi
                  sleep 1
                done
              fi
              wait "$SERVER_PID"
          ports:
            - containerPort: 8200
              name: http
          volumeMounts:
            - name: openbao-config
              mountPath: /openbao/config
              readOnly: true
            - name: openbao-data
              mountPath: /openbao/data
            - name: openbao-unseal
              mountPath: /openbao/unseal
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: openbao-config
          configMap:
            name: openbao-config
        - name: openbao-data
          persistentVolumeClaim:
            claimName: openbao-data-pvc
        - name: openbao-unseal
          secret:
            secretName: openbao-unseal-keys
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-service
  namespace: oci-core
  labels:
    app: openbao
spec:
  ports:
    - port: 8200
      targetPort: 8200
      name: http
  selector:
    app: openbao
