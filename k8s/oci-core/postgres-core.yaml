apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbackrest-core-config
  namespace: oci-core
  labels:
    app: postgres-core
data:
  pgbackrest.conf: |
    [global]
    repo1-type=s3
    repo1-s3-bucket=oci-backups
    repo1-s3-endpoint=garage-service.oci-core.svc.cluster.local
    repo1-storage-port=3943
    repo1-s3-uri-style=path
    repo1-s3-region=garage
    repo1-storage-verify-tls=n
    repo1-path=/pgbackrest/postgres-core
    repo1-retention-full=2
    repo1-retention-diff=7
    repo1-cipher-type=aes-256-cbc
    repo1-cipher-pass=oci-core-pgbackrest-aes256-cipher-key
    compress-type=zst
    process-max=2
    start-fast=y
    spool-path=/tmp/pgbackrest-spool
    log-path=/tmp/pgbackrest-log

    [oci]
    pg1-path=/var/lib/postgresql/data/pgdata
    pg1-port=5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-core-data-pvc
  namespace: oci-core
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-core
  namespace: oci-core
  labels:
    app: postgres-core
spec:
  serviceName: postgres-core-backend
  replicas: 1
  selector:
    matchLabels:
      app: postgres-core
  template:
    metadata:
      labels:
        app: postgres-core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "postgres"
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "archive_mode=on"
            - "-c"
            - "archive_timeout=60s"
            - "-c"
            - "archive_command=mkdir -p /var/lib/postgresql/wal_archive && test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f # pgbackrest"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: oci
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: wal-archive
              mountPath: /var/lib/postgresql/wal_archive
            - name: pg-run
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:

              cpu: "1"

              memory: 2Gi

        - name: postgres-exporter

          image: prometheuscommunity/postgres-exporter:v0.15.0

          env:

            - name: POSTGRES_USER

              valueFrom:

                secretKeyRef:

                  name: oci-core-secrets

                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: oci-core-secrets

                  key: POSTGRES_PASSWORD

            - name: DATA_SOURCE_NAME

              value: "postgresql://oci_monitor:$(POSTGRES_PASSWORD)@localhost:5432/oci?sslmode=disable"

          ports:

            - containerPort: 9187

              name: metrics

          resources:

            requests:

              cpu: 50m

              memory: 32Mi

            limits:

              cpu: 100m

              memory: 64Mi
        - name: pgbackrest
          image: woblerr/pgbackrest:2.54.2
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /tmp/pgbackrest-spool /tmp/pgbackrest-log /tmp/pgbackrest-metrics
              printf "pgbackrest_wal_archive_status 1\n" > /tmp/pgbackrest-metrics/metrics.prom
              (
                while true; do
                  BODY=$(cat /tmp/pgbackrest-metrics/metrics.prom 2>/dev/null || printf "pgbackrest_wal_archive_status 1\n")
                  printf "HTTP/1.1 200 OK\r\nContent-Type: text/plain; version=0.0.4\r\nContent-Length: %d\r\nConnection: close\r\n\r\n%s" "${#BODY}" "${BODY}" | nc -l -p 9854 >/dev/null 2>&1 || sleep 1
                done
              ) &
              export PGBACKREST_REPO1_S3_KEY="${BLOBSTORE_ACCESS_KEY:-GK0123456789abcdef01234567}"
              export PGBACKREST_REPO1_S3_KEY_SECRET="${BLOBSTORE_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
              pgbackrest --stanza=oci stanza-create || true
              (
                while true; do
                  ok=1
                  for wal in /var/lib/postgresql/wal_archive/0*; do
                    [ -f "$wal" ] || continue
                    if pgbackrest --stanza=oci archive-push "$wal"; then
                      rm -f "$wal"
                    else
                      ok=0
                    fi
                  done
                  printf "pgbackrest_wal_archive_status %d\npgbackrest_last_check_timestamp_seconds %d\n" "$ok" "$(date +%s)" > /tmp/pgbackrest-metrics/metrics.prom
                  sleep 2
                done
              ) &
              last_diff_day=""
              while true; do
                today=$(date -u +%Y-%m-%d)
                if [ "$today" != "$last_diff_day" ]; then
                  if pgbackrest --stanza=oci backup --type=diff || pgbackrest --stanza=oci backup --type=full; then
                    last_diff_day="$today"
                  fi
                fi
                sleep 30
              done
          env:
            - name: PGBACKREST_PG1_SOCKET_PATH
              value: /var/run/postgresql
            - name: PGBACKREST_PG1_USER
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_PASSWORD
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: BLOBSTORE_ACCESS_KEY
                  optional: true
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: BLOBSTORE_SECRET_KEY
                  optional: true
            - name: BLOBSTORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: BLOBSTORE_ACCESS_KEY
                  optional: true
            - name: BLOBSTORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: BLOBSTORE_SECRET_KEY
                  optional: true
          ports:
            - containerPort: 9854
              name: back-metrics
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: wal-archive
              mountPath: /var/lib/postgresql/wal_archive
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-core-data-pvc
        - name: init-script
          configMap:
            name: postgres-core-init-script
        - name: wal-archive
          emptyDir: {}
        - name: pg-run
          emptyDir: {}
        - name: pgbackrest-config
          configMap:
            name: pgbackrest-core-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-core-backend
  namespace: oci-core
  labels:
    app: postgres-core
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-core
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-core-backup-cronjob
  namespace: oci-core
spec:
  schedule: "0 2 * * *" # Daily at 02:00 AM UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-core-backup
        spec:
          containers:
          - name: postgres-backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting OCI Core PostgreSQL automated backup..."
              pg_dump -h postgres-core-backend -U "${POSTGRES_USER}" -d oci -F c -b -v -f /backups/oci_core_backup_$(date +%Y%m%d_%H%M%S).dump
              echo "OCI Core database backup completed successfully!"
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_PASSWORD
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-core-data-pvc
