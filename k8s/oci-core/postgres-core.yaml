apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-core-data-pvc
  namespace: oci-core
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-core
  namespace: oci-core
  labels:
    app: postgres-core
spec:
  serviceName: postgres-core-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres-core
  template:
    metadata:
      labels:
        app: postgres-core
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: oci
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-core-data-pvc
        - name: init-script
          configMap:
            name: postgres-core-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-core-service
  namespace: oci-core
  labels:
    app: postgres-core
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-core
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-core-backup-cronjob
  namespace: oci-core
spec:
  schedule: "0 2 * * *" # Daily at 02:00 AM UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting OCI Core PostgreSQL automated backup..."
              pg_dump -h postgres-core-service -U "${POSTGRES_USER}" -d oci -F c -b -v -f /backups/oci_core_backup_$(date +%Y%m%d_%H%M%S).dump
              echo "OCI Core database backup completed successfully!"
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-core-secrets
                  key: POSTGRES_PASSWORD
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-core-data-pvc
