# Scheduled Batch Jobs for Orange Cat Investments (OCI) - Development
# 1. Recurring ACH Deposit Batch Processor
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recurring-ach-processor
  namespace: oci-dev
  labels:
    app: recurring-ach-processor
    tier: batch
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: recurring-ach-processor
            tier: batch
        spec:
          restartPolicy: OnFailure
          containers:
            - name: processor
              image: localhost:32000/oci-worker:latest
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/oci-worker"]
              env:
                - name: ENABLE_CORE_INVEST
                  value: "true"
                - name: CORE_INVEST_API_URL
                  value: "https://core-invest-api-service.oci-dev.svc.cluster.local:50053"
                - name: BANK_API_BASE_URL
                  value: "http://mock-bank-service.external-sim.svc.cluster.local:8088"
                - name: RABBITMQ_URL
                  value: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-dev.svc.cluster.local:5672/"
                - name: TLS_CERT_FILE
                  value: "/etc/tls/certs/tls.crt"
                - name: TLS_KEY_FILE
                  value: "/etc/tls/certs/tls.key"
                - name: CA_CERT_FILE
                  value: "/etc/tls/ca/ca.crt"
                - name: BATCH_MODE
                  value: "ach-recurring"
              volumeMounts:
                - name: tls-certs
                  mountPath: /etc/tls/certs
                  readOnly: true
                - name: ca-cert
                  mountPath: /etc/tls/ca
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: tls-certs
              secret:
                secretName: oci-worker-dev-tls-certs
            - name: ca-cert
              configMap:
                name: oci-ca-bundle
                optional: true
---
# 2. Automated End-of-Month Statement & Tax Batch Generator
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eom-statement-generator
  namespace: oci-dev
  labels:
    app: eom-statement-generator
    tier: batch
spec:
  schedule: "0 1 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: eom-statement-generator
            tier: batch
        spec:
          restartPolicy: OnFailure
          containers:
            - name: generator
              image: localhost:32000/oci-worker:latest
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/oci-worker"]
              env:
                - name: ENABLE_CORE_INVEST
                  value: "true"
                - name: CORE_INVEST_API_URL
                  value: "https://core-invest-api-service.oci-dev.svc.cluster.local:50053"
                - name: NEXTCLOUD_URL
                  value: "http://nextcloud-service.oci-internal.svc.cluster.local:80"
                - name: TLS_CERT_FILE
                  value: "/etc/tls/certs/tls.crt"
                - name: TLS_KEY_FILE
                  value: "/etc/tls/certs/tls.key"
                - name: CA_CERT_FILE
                  value: "/etc/tls/ca/ca.crt"
                - name: BATCH_MODE
                  value: "eom-statements"
              volumeMounts:
                - name: tls-certs
                  mountPath: /etc/tls/certs
                  readOnly: true
                - name: ca-cert
                  mountPath: /etc/tls/ca
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: tls-certs
              secret:
                secretName: oci-worker-dev-tls-certs
            - name: ca-cert
              configMap:
                name: oci-ca-bundle
                optional: true
