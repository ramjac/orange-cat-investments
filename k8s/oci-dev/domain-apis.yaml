# NetworkPolicy: Restrict Ingress to Domain APIs strictly to BLL pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: domain-apis-network-policy
  namespace: oci-dev
spec:
  podSelector:
    matchLabels:
      tier: domain-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: bll
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
    # Gatus uptime monitor TCP connectivity health probes from monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
