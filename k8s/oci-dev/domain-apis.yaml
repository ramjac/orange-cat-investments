# Workforce Domain API (Port 50051) - Development
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workforce-api
  namespace: oci-dev
  labels:
    app: workforce-api
    tier: domain-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-api
  namespace: oci-dev
  labels:
    app: workforce-api
    tier: domain-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workforce-api
  template:
    metadata:
      labels:
        app: workforce-api
        tier: domain-api
    spec:
      serviceAccountName: workforce-api
      containers:
        - name: workforce-api
          image: localhost:32000/workforce-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc-http
          env:
            - name: PORT
              value: "50051"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workforce-db-secret
                  key: DATABASE_URL
            - name: DATABASE_URL_FILE
              value: "/etc/db-creds/DATABASE_URL"
            - name: ENABLE_FELINE_WORKFORCE
              value: "true"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/etc/tls/ca/ca.crt"
            - name: GOMEMLIMIT
              value: "850MiB"
          volumeMounts:
            - name: db-creds
              mountPath: /etc/db-creds
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: db-creds
          secret:
            secretName: workforce-db-secret
        - name: tls-certs
          csi:
            driver: spiffe.csi.cert-manager.io
            readOnly: true
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: workforce-api-service
  namespace: oci-dev
  labels:
    app: workforce-api
    tier: domain-api
spec:
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc-http
  selector:
    app: workforce-api
---
