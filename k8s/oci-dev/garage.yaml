# ==============================================================================
# Garage S3-Compatible Object Storage (Phase 11 / 7.43) — oci-dev
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: oci-dev
  labels:
    app: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "5f9e8c2a1b3d5e7f90123456789abcdef0123456789abcdef0123456789abcd1"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".dev.s3.oci.local"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".dev.web.oci.local"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "oci_garage_admin_token_dev_v1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta-pvc
  namespace: oci-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data-pvc
  namespace: oci-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: oci-dev
  labels:
    app: garage
    tier: storage
spec:
  serviceName: garage-service
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
        tier: storage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v1.0.1
          imagePullPolicy: IfNotPresent
          args: ["/garage", "-c", "/etc/garage.toml", "server"]
          ports:
            - containerPort: 3900
              name: s3-api
            - containerPort: 3901
              name: rpc
            - containerPort: 3902
              name: s3-web
            - containerPort: 3903
              name: admin
          volumeMounts:
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: garage-meta
              mountPath: /var/lib/garage/meta
            - name: garage-data
              mountPath: /var/lib/garage/data
          readinessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
        - name: s3-tls
          image: caddy:2.8-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "caddy"
            - "reverse-proxy"
            - "--from"
            - "https://garage-service.oci-dev.svc.cluster.local:3943"
            - "--to"
            - "http://127.0.0.1:3900"
            - "--internal-certs"
          ports:
            - containerPort: 3943
              name: s3-tls
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: garage-config
          configMap:
            name: garage-config
        - name: garage-meta
          persistentVolumeClaim:
            claimName: garage-meta-pvc
        - name: garage-data
          persistentVolumeClaim:
            claimName: garage-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: garage-service
  namespace: oci-dev
  labels:
    app: garage
    tier: storage
spec:
  ports:
    - port: 3900
      targetPort: 3900
      name: s3-api
    - port: 3943
      targetPort: 3943
      name: s3-tls
    - port: 3903
      targetPort: 3903
      name: admin
  selector:
    app: garage
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap
  namespace: oci-dev
  labels:
    app: garage-bootstrap
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: garage-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: GARAGE_ADMIN_URL
              value: "http://garage-service.oci-dev.svc.cluster.local:3903"
            - name: GARAGE_ADMIN_TOKEN
              value: "oci_garage_admin_token_dev_v1"
            - name: BLOBSTORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-dev-secrets
                  key: BLOBSTORE_ACCESS_KEY
                  optional: true
            - name: BLOBSTORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-dev-secrets
                  key: BLOBSTORE_SECRET_KEY
                  optional: true
          command:
            - python3
            - -c
            - |
              import json, os, sys, time, urllib.error, urllib.request

              base = os.environ["GARAGE_ADMIN_URL"]
              tok = os.environ["GARAGE_ADMIN_TOKEN"]
              acc_key = os.environ.get("BLOBSTORE_ACCESS_KEY") or "GKdeadbeef0123456789abcdef"
              sec_key = os.environ.get("BLOBSTORE_SECRET_KEY") or "deadbeef0123456789abcdefdeadbeef0123456789abcdefdeadbeef01234567"

              def call(method, path, body=None):
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(base + path, data=data, method=method)
                  req.add_header("Authorization", f"Bearer {tok}")
                  if data is not None:
                      req.add_header("Content-Type", "application/json")
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      raw = resp.read().decode()
                      return json.loads(raw) if raw else {}

              for _ in range(30):
                  try:
                      status = call("GET", "/v1/status")
                      break
                  except Exception as exc:
                      print(f"Waiting for Garage admin API: {exc}")
                      time.sleep(2)
              else:
                  sys.exit("Garage admin API did not become ready")

              node_id = status["node"]
              layout = call("GET", "/v1/layout")
              if not layout.get("roles"):
                  call("POST", "/v1/layout", [{"id": node_id, "zone": "dc1", "capacity": 5368709120, "tags": ["oci-dev"]}])
                  ver = layout.get("version", 0) + 1
                  call("POST", "/v1/layout/apply", {"version": ver})
                  print(f"Applied Garage layout version {ver} for node {node_id}")

              try:
                  call("POST", "/v1/key/import", {"accessKeyId": acc_key, "secretAccessKey": sec_key, "name": "oci-dev-platform"})
              except urllib.error.HTTPError as e:
                  if e.code != 409:
                      print(f"Key import status: {e.code}")

              existing = {b["globalAliases"][0]: b["id"] for b in call("GET", "/v1/bucket?list") if b.get("globalAliases")}
              for bucket in ("oci-statements", "oci-firmware", "oci-backups"):
                  bid = existing.get(bucket)
                  if not bid:
                      created = call("POST", "/v1/bucket", {"globalAlias": bucket})
                      bid = created["id"]
                  call("POST", "/v1/bucket/allow", {
                      "bucketId": bid,
                      "accessKeyId": acc_key,
                      "permissions": {"read": True, "write": True, "owner": True},
                  })
                  print(f"Configured Garage bucket {bucket} ({bid})")
