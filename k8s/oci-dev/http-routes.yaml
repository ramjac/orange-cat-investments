apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oci-dev-api-route
  namespace: oci-dev
  labels:
    owner: emp-human-elise
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oci-edge-gateway
      namespace: oci-core
  hostnames:
    - dev.api.oci.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/customer/
        - path:
            type: PathPrefix
            value: /customer/
      timeouts:
        request: 3600s
      backendRefs:
        - name: oci-customer-bff-dev-service
          port: 8083
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 3600s
      backendRefs:
        - name: oci-employee-bff-dev-service
          port: 8081
