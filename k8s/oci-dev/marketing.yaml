apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-marketing
  namespace: oci-dev
  labels:
    app: oci-marketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-marketing
  template:
    metadata:
      labels:
        app: oci-marketing
    spec:
      containers:
        - name: oci-marketing
          image: localhost:32000/oci-marketing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oci-marketing-service
  namespace: oci-dev
  labels:
    app: oci-marketing
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: oci-marketing
