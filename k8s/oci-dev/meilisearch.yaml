apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: oci-dev
  labels:
    app: meilisearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.7
          ports:
            - containerPort: 7700
              name: http
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-dev-secrets
                  key: MEILI_MASTER_KEY
            - name: MEILI_ENV
              value: development
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch-service
  namespace: oci-dev
  labels:
    app: meilisearch
spec:
  ports:
    - port: 7700
      targetPort: 7700
      name: http
  selector:
    app: meilisearch
