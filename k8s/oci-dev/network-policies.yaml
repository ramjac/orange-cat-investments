            matchLabels:
              kubernetes.io/metadata.name: external-sim
          podSelector:
            matchLabels:
              app: mock-hardware-dev
      ports:
        - protocol: TCP
          port: 8086
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: domain-api
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: meilisearch
      ports:
        - protocol: TCP
          port: 7700
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oci-internal
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-sim
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - mock-bank-dev
                  - mock-broker-dev
      ports:
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8089
---
