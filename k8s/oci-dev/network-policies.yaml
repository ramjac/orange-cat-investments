        - podSelector:
            matchLabels:
              tier: bll
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-dev
      ports:
        - protocol: TCP
          port: 5432
---
