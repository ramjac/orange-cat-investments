# ==============================================================================
# Zero-Trust NetworkPolicy Microsegmentation Matrix: oci-dev (Phase 9 / 7.36)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: oci-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Global Egress: Allow every pod in oci-dev to query cluster DNS and export telemetry
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: global-dns-and-telemetry-egress
  namespace: oci-dev
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 9090
---
# Observability Ingress: Allow Prometheus & Gatus in monitoring to scrape/probe oci-dev pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-scrape-ingress
  namespace: oci-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - prometheus
                  - gatus
---
# Edge Portals & Marketing Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-portals-network-policy
  namespace: oci-dev
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - oci-customer-portal-dev
          - oci-employee-portal-dev
          - oci-marketing
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - ingress
                  - kube-system
                  - gateway-system
                  - envoy-gateway-system
      ports:
        - protocol: TCP
          port: 5173
        - protocol: TCP
          port: 5174
        - protocol: TCP
          port: 8080
---
# Tier 2: BFFs (oci-customer-bff-dev, oci-employee-bff-dev, oci-pebble-proxy-dev)
# Invariant: Zero egress to postgres-dev (:5432) or Domain APIs (:50051-50054)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-tier-network-policy
  namespace: oci-dev
spec:
  podSelector:
    matchLabels:
      tier: bff
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - ingress
                  - kube-system
                  - gateway-system
                  - envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oci-internal
          podSelector:
            matchLabels:
              app: forgejo-runner
        - podSelector:
            matchLabels:
              app: oci-worker-dev
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: bll
      ports:
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
    - to:
        - podSelector:
            matchLabels:
              app: valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: meilisearch
      ports:
        - protocol: TCP
          port: 7700
    - to:
        - podSelector:
            matchLabels:
              app: zitadel
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oci-internal
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8000
---
# Tier 3: BLLs (customer-bll, internal-bll)
