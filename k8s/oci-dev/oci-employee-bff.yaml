apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-employee-bff-dev
  namespace: oci-dev
  labels:
    app: oci-employee-bff-dev
    tier: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-employee-bff-dev
  template:
    metadata:
      labels:
        app: oci-employee-bff-dev
        tier: bff
    spec:
      containers:
        - name: oci-employee-bff-dev
          image: localhost:32000/oci-employee-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: ENV
              value: "development"
            - name: VALKEY_ADDR
              value: "valkey-service.oci-dev.svc.cluster.local:6379"
            - name: ENABLE_DEV_MOCK_AUTH
              value: "true"
            - name: INTERNAL_BLL_URL
              value: "http://internal-bll-service.oci-dev.svc.cluster.local:8086"
            - name: ENABLE_FELINE_WORKFORCE
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oci-employee-bff-dev-service
  namespace: oci-dev
  labels:
    app: oci-employee-bff-dev
    tier: bff
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app: oci-employee-bff-dev
