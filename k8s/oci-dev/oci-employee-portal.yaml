apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-employee-portal-dev
  namespace: oci-dev
  labels:
    app: oci-employee-portal-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-employee-portal-dev
  template:
    metadata:
      labels:
        app: oci-employee-portal-dev
    spec:
      containers:
        - name: oci-employee-portal-dev
          image: localhost:32000/oci-employee-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: PORT
              value: "5173"
            - name: STATIC_DIR
              value: "/dist"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: oci-employee-portal-dev-service
  namespace: oci-dev
  labels:
    app: oci-employee-portal-dev
spec:
  ports:
    - port: 5173
      targetPort: 5173
      name: http
  selector:
    app: oci-employee-portal-dev
