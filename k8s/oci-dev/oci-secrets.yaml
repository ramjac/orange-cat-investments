apiVersion: v1
kind: Secret
metadata:
  name: oci-dev-secrets
  namespace: oci-dev
type: Opaque
stringData:
  DATABASE_URL: "postgres://oci_admin:oci_secure_pass@postgres-dev-service.oci-dev.svc.cluster.local:5432/oci_dev?sslmode=disable"
  POSTGRES_USER: "oci_admin"
  POSTGRES_PASSWORD: "oci_secure_pass"
  POSTGRES_DB: "oci_dev"
  RABBITMQ_URL: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-core.svc.cluster.local:5672/oci-dev"
  VALKEY_ADDR: "valkey-dev-service.oci-dev.svc.cluster.local:6379"
  RABBITMQ_DEFAULT_USER: "oci_rabbit"
  RABBITMQ_DEFAULT_PASS: "oci_rabbit_pass"
  APCA_API_KEY_ID: "DEV_KEY_01"
  APCA_API_SECRET_KEY: "DEV_SECRET_01"
  PLAID_CLIENT_ID: "mock-dev-client"
  PLAID_SECRET: "mock-dev-secret"
