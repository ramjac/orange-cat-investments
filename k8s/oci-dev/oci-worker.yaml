apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-worker-dev
  namespace: oci-dev
  labels:
    app: oci-worker-dev
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-worker-dev
  template:
    metadata:
      labels:
        app: oci-worker-dev
        tier: worker
    spec:
      containers:
        - name: oci-worker-dev
          image: localhost:32000/oci-worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: health
          env:
            - name: ENABLE_CORE_INVEST
              value: "true"
            - name: ENABLE_FELINE_WORKFORCE
              value: "true"
            - name: HEALTH_PORT
              value: "8080"
            - name: CUSTOMER_BLL_URL
              value: "https://customer-bll-service.oci-dev.svc.cluster.local:8085"
            - name: INTERNAL_BLL_URL
              value: "https://internal-bll-service.oci-dev.svc.cluster.local:8086"
            - name: EMPLOYEE_BFF_URL
              value: "http://oci-employee-bff-dev-service.oci-dev.svc.cluster.local:8081"
            - name: PEBBLE_PROXY_URL
              value: "http://oci-pebble-proxy-dev-service.oci-dev.svc.cluster.local:8082"
            - name: RABBITMQ_URL
              value: "amqp://oci_rabbit:oci_rabbit_pass@rabbitmq-service.oci-dev.svc.cluster.local:5672/"
            - name: TLS_CERT_FILE
              value: "/etc/tls/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/tls/certs/tls.key"
            - name: CLIENT_CA_FILE
              value: "/etc/tls/ca/ca.crt"
            - name: CA_CERT_PATH
              value: "/etc/oci/tls/ca.crt"
            - name: CA_KEY_PATH
              value: "/etc/oci/tls/ca.key"
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: oci-dev-secrets
                  key: INTERNAL_SERVICE_KEY
                  optional: true
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/tls/ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/oci/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tls-certs
          secret:
            secretName: oci-worker-dev-tls-certs
        - name: ca-cert
          configMap:
            name: oci-ca-bundle
            optional: true
        - name: ca-bundle
          configMap:
            name: oci-ca-bundle
            optional: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oci-worker-dev-tls
  namespace: oci-dev
spec:
  secretName: oci-worker-dev-tls-certs
  issuerRef:
    name: oci-lan-issuer
    kind: ClusterIssuer
  commonName: oci-worker-dev
