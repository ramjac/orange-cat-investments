apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dev-data-pvc
  namespace: oci-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-dev
  namespace: oci-dev
  labels:
    app: postgres-dev
spec:
  serviceName: postgres-dev-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres-dev
  template:
    metadata:
      labels:
        app: postgres-dev
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: oci_dev
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oci-dev-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-dev-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-dev-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-dev-storage
          persistentVolumeClaim:
            claimName: postgres-dev-data-pvc
        - name: init-script
          configMap:
            name: postgres-dev-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-dev-service
  namespace: oci-dev
  labels:
    app: postgres-dev
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-dev
