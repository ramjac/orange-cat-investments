apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: oci-dev
  labels:
    app: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7.2-alpine
          command:
            - valkey-server
            - "--appendonly"
            - "yes"
            - "--dir"
            - "/data"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data-pvc
  namespace: oci-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-service
  namespace: oci-dev
  labels:
    app: valkey
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: valkey
