apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: oci-dev
  labels:
    app: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7.2-alpine
          command:
            - valkey-server
            - "--appendonly"
            - "yes"
            - "--dir"
            - "/data"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:

              cpu: 250m

              memory: 256Mi

        - name: valkey-exporter

          image: oliver006/redis_exporter:v1.58.0

          env:

            - name: REDIS_ADDR

              value: "redis://localhost:6379"

          ports:

            - containerPort: 9121

              name: metrics

          resources:

            requests:

              cpu: 25m

              memory: 16Mi

            limits:

              cpu: 50m

              memory: 32Mi
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data-pvc
  namespace: oci-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-service
  namespace: oci-dev
  labels:
    app: valkey
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: valkey
