apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: oci-internal
  labels:
    app: forgejo-runner
data:
  config.yaml: |
    runner:
      capacity: 2
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "ubuntu-latest:docker://node:20-bookworm"
        - "ubuntu-22.04:docker://node:20-bookworm"
        - "docker:docker://docker:dind"
      envs:
        DOCKER_HOST: tcp://localhost:2375
    host:
      workdir: /tmp/runner/workspace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: oci-internal
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      containers:
        - name: runner
          image: codeberg.org/forgejo/act_runner:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: GITEA_INSTANCE_URL
              value: "http://forgejo-service.oci-internal.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: RUNNER_TOKEN
            - name: GITEA_RUNNER_NAME
              value: "oci-cluster-runner"
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest:docker://node:20-bookworm,ubuntu-22.04:docker://node:20-bookworm,docker:docker://docker:dind"
            - name: CONFIG_FILE
              value: "/config/config.yaml"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: runner-config
              mountPath: /config
            - name: runner-data
              mountPath: /data
        # Docker-in-Docker sidecar engine providing Docker daemon for container jobs
        - name: daemon
          image: docker:26-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-data
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}

