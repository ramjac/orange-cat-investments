apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner-sa
  namespace: oci-internal
  labels:
    app: forgejo-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forgejo-runner-deployer
  labels:
    app: forgejo-runner
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "cert-manager.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgejo-runner-deployer-binding
  labels:
    app: forgejo-runner
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-sa
    namespace: oci-internal
roleRef:
  kind: ClusterRole
  name: forgejo-runner-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: oci-internal
  labels:
    app: forgejo-runner
data:
  config.yaml: |
    runner:
      capacity: 2
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "ubuntu-latest:docker://node:20-bookworm"
        - "ubuntu-22.04:docker://node:20-bookworm"
        - "docker:docker://docker:dind"
      envs:
        DOCKER_HOST: tcp://localhost:2375
    container:
      network: "host"
      privileged: true
      options: "-v /tmp:/tmp -v /data:/data"
      valid_volumes:
        - "/var/run/docker.sock"
        - "/var/run/secrets/kubernetes.io/serviceaccount"
        - "/tmp"
        - "/data"
    host:
      workdir: /tmp/runner/workspace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: oci-internal
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init-kubeconfig
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data
              if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
                TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                CA_DATA=$(base64 -w 0 < /var/run/secrets/kubernetes.io/serviceaccount/ca.crt 2>/dev/null || base64 < /var/run/secrets/kubernetes.io/serviceaccount/ca.crt | tr -d '\n')
                cat <<EOF > /data/kubeconfig
              apiVersion: v1
              kind: Config
              clusters:
              - name: in-cluster
                cluster:
                  certificate-authority-data: ${CA_DATA}
                  server: https://kubernetes.default.svc.cluster.local:443
              contexts:
              - name: in-cluster
                context:
                  cluster: in-cluster
                  namespace: oci-internal
                  user: runner-sa
              current-context: in-cluster
              users:
              - name: runner-sa
                user:
                  token: ${TOKEN}
              EOF
                chmod 644 /data/kubeconfig
                echo "Generated in-cluster /data/kubeconfig successfully."
              fi
          volumeMounts:
            - name: runner-data
              mountPath: /data
      containers:
        - name: runner
          image: gitea/act_runner:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: GITEA_INSTANCE_URL
              value: "http://forgejo-service.oci-internal.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: RUNNER_TOKEN
            - name: GITEA_RUNNER_NAME
              value: "oci-cluster-runner"
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest:docker://node:20-bookworm,ubuntu-22.04:docker://node:20-bookworm,docker:docker://docker:dind"
            - name: CONFIG_FILE
              value: "/config/config.yaml"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: runner-config
              mountPath: /config
            - name: runner-data
              mountPath: /data
            - name: docker-sock
              mountPath: /var/run
        # Docker-in-Docker sidecar engine providing Docker daemon for container jobs
        - name: daemon
          image: docker:26-dind
          command:
            - dockerd
            - --host=tcp://0.0.0.0:2375
            - --host=unix:///var/run/docker.sock
            - --insecure-registry=localhost:32000
            - --insecure-registry=127.0.0.1:32000
            - --insecure-registry=container-registry.kube-system.svc.cluster.local:5000
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: docker-sock
              mountPath: /var/run
            - name: runner-data
              mountPath: /data
      volumes:
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-data
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
        - name: docker-sock
          emptyDir: {}
