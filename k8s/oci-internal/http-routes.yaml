apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oci-internal-nextcloud-route
  namespace: oci-internal
  labels:
    owner: emp-human-elise
    oci.local/cots-route: "true"
    app.kubernetes.io/part-of: oci-gateway-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oci-edge-gateway
      namespace: oci-core
  hostnames:
    - nextcloud.oci.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 3600s
      backendRefs:
        - name: nextcloud-service
          port: 80
---
