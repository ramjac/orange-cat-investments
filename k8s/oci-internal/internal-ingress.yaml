apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oci-internal-ingress
  namespace: oci-internal
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: public
  rules:
    - host: nextcloud.oci.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud-service
                port:
                  number: 80
    - host: forgejo.oci.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo-service
                port:
                  number: 3000
    - host: erpnext.oci.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erpnext-frappe-service
                port:
                  number: 8000
    - host: hr.oci.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frappe-hr-service
                port:
                  number: 8000
    - host: snipeit.oci.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snipe-it-service
                port:
                  number: 80
