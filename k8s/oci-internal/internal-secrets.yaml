# KV-v2 ExternalSecret for oci-internal COTS apps (7.20d)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: oci-internal
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-kv-store
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: oci-internal/config
