  namespace: oci-internal
spec:
  podSelector:
    matchLabels:
      app: postgres-internal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oci-core
          podSelector:
            matchLabels:
              app: openbao
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oci-core
          podSelector:
            matchLabels:
              app: garage
      ports:
        - protocol: TCP
          port: 3900
        - protocol: TCP
          port: 3943
---
