# Mailpit In-Cluster SMTP Sandbox (7.45)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit-network-policy
  namespace: oci-internal
spec:
  podSelector:
    matchLabels:
      app: mailpit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - oci-core
                  - oci-dev
          podSelector:
            matchExpressions:
              - key: tier
                operator: In
                values:
                  - worker
                  - batch
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - oci-core
                  - oci-dev
          podSelector:
            matchLabels:
              app: zitadel
      ports:
        - protocol: TCP
          port: 1025
    - from:
        - podSelector:
            matchLabels:
              app: forgejo-runner
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - ingress
                  - kube-system
                  - gateway-system
                  - envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oci-core
          podSelector:
            matchLabels:
              app: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8025
