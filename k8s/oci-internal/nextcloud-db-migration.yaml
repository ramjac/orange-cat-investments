apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-db-user-migration
  namespace: oci-internal
  labels:
    app: nextcloud-db-migration
spec:
  template:
    metadata:
      labels:
        app: nextcloud-db-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: postgres-internal-service
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: NEXTCLOUD_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for postgres-internal-service to become ready..."
              until pg_isready -h "$PGHOST" -U "$PGUSER"; do
                sleep 2
              done

              echo "Migrating nextcloud_user role and database permissions..."
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d oci_internal <<-EOSQL
                SELECT 'CREATE DATABASE nextcloud' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'nextcloud')\gexec
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'nextcloud_user') THEN
                    CREATE ROLE nextcloud_user WITH LOGIN PASSWORD '$NEXTCLOUD_DB_PASS' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
                  ELSE
                    ALTER ROLE nextcloud_user WITH PASSWORD '$NEXTCLOUD_DB_PASS';
                  END IF;
                END
                \$\$;
                GRANT ALL PRIVILEGES ON DATABASE nextcloud TO nextcloud_user;
                ALTER DATABASE nextcloud OWNER TO nextcloud_user;
              EOSQL

              echo "Reassigning existing Nextcloud schema and table ownership..."
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d nextcloud <<-EOSQL
                GRANT ALL ON SCHEMA public TO nextcloud_user;
                GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO nextcloud_user;
                GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO nextcloud_user;
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO nextcloud_user;
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO nextcloud_user;
                DO \$\$
                DECLARE
                  r RECORD;
                BEGIN
                  FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                    EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO nextcloud_user';
                  END LOOP;
                  FOR r IN (SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = 'public') LOOP
                    EXECUTE 'ALTER SEQUENCE public.' || quote_ident(r.sequence_name) || ' OWNER TO nextcloud_user';
                  END LOOP;
                END
                \$\$;
              EOSQL
              echo "Nextcloud role and object ownership migration completed successfully."
