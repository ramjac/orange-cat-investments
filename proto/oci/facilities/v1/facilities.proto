syntax = "proto3";

package oci.facilities.v1;

option go_package = "github.com/orange-cat-investments/oci/pkg/gen/go/facilities/v1;facilitiesv1";

service FacilitiesService {
  rpc GetAsset (GetAssetRequest) returns (GetAssetResponse);
  rpc ListAssets (ListAssetsRequest) returns (ListAssetsResponse);
  rpc CreateAsset (CreateAssetRequest) returns (CreateAssetResponse);
  rpc RecordAssetHeartbeat (RecordAssetHeartbeatRequest) returns (RecordAssetHeartbeatResponse);
  rpc ListAssetConnectivity (ListAssetConnectivityRequest) returns (ListAssetConnectivityResponse);

  rpc CreateMaintenanceLog (CreateMaintenanceLogRequest) returns (CreateMaintenanceLogResponse);
  rpc ListMaintenanceLogs (ListMaintenanceLogsRequest) returns (ListMaintenanceLogsResponse);
  rpc SyncOfflineLogs (SyncOfflineLogsRequest) returns (SyncOfflineLogsResponse);

  rpc CreateFirmwareRelease (CreateFirmwareReleaseRequest) returns (CreateFirmwareReleaseResponse);
  rpc ListFirmwareReleases (ListFirmwareReleasesRequest) returns (ListFirmwareReleasesResponse);
  rpc CreateOTAJob (CreateOTAJobRequest) returns (CreateOTAJobResponse);
  rpc ListOTAJobs (ListOTAJobsRequest) returns (ListOTAJobsResponse);
  rpc UpdateOTAJobStatus (UpdateOTAJobStatusRequest) returns (UpdateOTAJobStatusResponse);

  rpc IngestEnvironmentalTelemetry (IngestTelemetryRequest) returns (IngestTelemetryResponse);
  rpc StreamEnvironmentalTelemetry (StreamTelemetryRequest) returns (stream TelemetrySample);

  rpc ControlPTZ (ControlPTZRequest) returns (ControlPTZResponse);
  rpc CalibrateCameraLens (CalibrateCameraLensRequest) returns (CalibrateCameraLensResponse);

  rpc ClaimOutboxEvents (ClaimOutboxEventsRequest) returns (ClaimOutboxEventsResponse);
  rpc AckOutboxEvents (AckOutboxEventsRequest) returns (AckOutboxEventsResponse);
}

message HardwareAsset {
  string asset_id = 1;
  string serial_number = 2;
  string asset_type = 3;
  string model = 4;
  string status = 5;
  string zone_id = 6;
  string assigned_employee_id = 7;
  string last_ping_at = 8;
  string created_at = 9;
}

message GetAssetRequest {
  string asset_id = 1;
}

message GetAssetResponse {
  HardwareAsset asset = 1;
}

message ListAssetsRequest {
  int32 limit = 1;
  string cursor_id = 2;
  string asset_type = 3;
}

message ListAssetsResponse {
  repeated HardwareAsset assets = 1;
  string next_cursor = 2;
}

message CreateAssetRequest {
  string serial_number = 1;
  string asset_type = 2;
  string model = 3;
  string status = 4;
  string zone_id = 5;
}

message CreateAssetResponse {
  HardwareAsset asset = 1;
}

message RecordAssetHeartbeatRequest {
  string serial_number = 1;
  string observed_at = 2;
}

message RecordAssetHeartbeatResponse {
  HardwareAsset asset = 1;
}

message AssetConnectivity {
  HardwareAsset asset = 1;
  bool online = 2;
}

message ListAssetConnectivityRequest {
  string zone_id = 1;
  int32 stale_after_seconds = 2;
}

message ListAssetConnectivityResponse {
  repeated AssetConnectivity assets = 1;
}

message MaintenanceLog {
  string log_id = 1;
  string ticket_id = 2;
  string asset_id = 3;
  string technician_id = 4;
  string qr_code_scanned = 5;
  string action_taken = 6;
  string notes = 7;
  string synced_at = 8;
}

message CreateMaintenanceLogRequest {
  string asset_id = 1;
  string qr_code_scanned = 2;
  string action_taken = 3;
  string technician_id = 4;
  string notes = 5;
}

message CreateMaintenanceLogResponse {
  MaintenanceLog log = 1;
}

message ListMaintenanceLogsRequest {
  string asset_id = 1;
  int32 limit = 2;
}

message ListMaintenanceLogsResponse {
  repeated MaintenanceLog logs = 1;
}

message SyncOfflineLogsRequest {
  repeated MaintenanceLog logs = 1;
}

message SyncOfflineLogsResponse {
  int32 synced_count = 1;
  repeated MaintenanceLog logs = 2;
}

message FirmwareRelease {
  string release_id = 1;
  string device_type = 2;
  string version = 3;
  string file_url = 4;
  string checksum = 5;
  string min_hardware_version = 6;
  string status = 7;
  string created_at = 8;
  string cosign_signature = 9;
}

message CreateFirmwareReleaseRequest {
  string device_type = 1;
  string version = 2;
  string file_url = 3;
  string checksum = 4;
  string min_hardware_version = 5;
  string status = 6;
  string cosign_signature = 7;
}

message CreateFirmwareReleaseResponse {
  FirmwareRelease release = 1;
}

message ListFirmwareReleasesRequest {
  string device_type = 1;
}

message ListFirmwareReleasesResponse {
  repeated FirmwareRelease releases = 1;
}

message DeviceOTAJob {
  string job_id = 1;
  string asset_id = 2;
  string release_id = 3;
  string status = 4;
  string error_message = 5;
  string scheduled_at = 6;
  string completed_at = 7;
}

message CreateOTAJobRequest {
  repeated string asset_ids = 1;
  string release_id = 2;
}

message CreateOTAJobResponse {
  repeated DeviceOTAJob jobs = 1;
}

message ListOTAJobsRequest {
  string asset_id = 1;
  string status = 2;
}

message ListOTAJobsResponse {
  repeated DeviceOTAJob jobs = 1;
}

message UpdateOTAJobStatusRequest {
  string job_id = 1;
  string status = 2;
  string error_message = 3;
}

message UpdateOTAJobStatusResponse {
  DeviceOTAJob job = 1;
}

message IngestTelemetryRequest {
  string zone_id = 1;
  double temperature_c = 2;
  double relative_humidity_pct = 3;
  double light_intensity_lux = 4;
  double noise_level_db = 5;
}

message IngestTelemetryResponse {
  string telemetry_id = 1;
  string status = 2;
}

message StreamTelemetryRequest {
  string zone_id = 1;
  int32 sample_count = 2;
}

message TelemetrySample {
  string telemetry_id = 1;
  string zone_id = 2;
  double temperature_c = 3;
  double relative_humidity_pct = 4;
  double light_intensity_lux = 5;
  double noise_level_db = 6;
  string timestamp = 7;
}

message ControlPTZRequest {
  string camera_id = 1;
  double pan = 2;
  double tilt = 3;
  double zoom = 4;
}

message ControlPTZResponse {
  string camera_id = 1;
  string status = 2;
}

message CalibrateCameraLensRequest {
  string camera_id = 1;
}

message CalibrateCameraLensResponse {
  string camera_id = 1;
  string status = 2;
}

message OutboxEvent {
  int64 id = 1;
  string schema = 2;
  string event_id = 3;
  string topic = 4;
  string aggregate_id = 5;
  bytes payload = 6;
  int32 attempts = 7;
  string created_at = 8;
}

message OutboxFailure {
  int64 id = 1;
  string schema = 2;
  string error = 3;
}

message ClaimOutboxEventsRequest {
  int32 limit = 1;
  int64 lease_ms = 2;
}

message ClaimOutboxEventsResponse {
  repeated OutboxEvent events = 1;
}

message AckOutboxEventsRequest {
  repeated int64 published_ids = 1;
  repeated OutboxFailure failures = 2;
}

message AckOutboxEventsResponse {
  int32 acknowledged = 1;
}
