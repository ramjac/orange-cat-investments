syntax = "proto3";

package oci.ops.v1;

option go_package = "github.com/orange-cat-investments/oci/pkg/gen/go/ops/v1;opsv1";

service OpsService {
  rpc CreateTicket (CreateTicketRequest) returns (CreateTicketResponse);
  rpc GetTicket (GetTicketRequest) returns (GetTicketResponse);
  rpc ListTickets (ListTicketsRequest) returns (ListTicketsResponse);
  rpc UpdateTicket (UpdateTicketRequest) returns (UpdateTicketResponse);
  rpc AcknowledgeTicket (AcknowledgeTicketRequest) returns (AcknowledgeTicketResponse);
  rpc CloseTicket (CloseTicketRequest) returns (CloseTicketResponse);

  rpc CreateCustomerTicket (CreateCustomerTicketRequest) returns (CreateCustomerTicketResponse);
  rpc ListCustomerTickets (ListCustomerTicketsRequest) returns (ListCustomerTicketsResponse);
  rpc AddTicketComment (AddTicketCommentRequest) returns (AddTicketCommentResponse);
  rpc ListTicketComments (ListTicketCommentsRequest) returns (ListTicketCommentsResponse);

  rpc ListAlerts (ListAlertsRequest) returns (ListAlertsResponse);
  rpc CreateAlert (CreateAlertRequest) returns (CreateAlertResponse);
  rpc AcknowledgeAlert (AcknowledgeAlertRequest) returns (AcknowledgeAlertResponse);
  rpc SendPushNotification (SendPushNotificationRequest) returns (SendPushNotificationResponse);
}

message ITTicket {
  string ticket_id = 1;
  string title = 2;
  string body = 3;
  string state = 4;
  string severity = 5;
  string category = 6;
  string source = 7;
  string customer_id = 8;
  string author_username = 9;
  string assignee_username = 10;
  bool is_urgent = 11;
  string acknowledged_by = 12;
  string acknowledged_at = 13;
  string created_at = 14;
  string updated_at = 15;
  string resolution_notes = 16;
  string forgejo_repo = 17;
  int64 forgejo_issue_id = 18;
}

message TicketComment {
  string comment_id = 1;
  string ticket_id = 2;
  string author_username = 3;
  string comment = 4;
  bool is_internal = 5;
  string created_at = 6;
}

message CreateTicketRequest {
  string title = 1;
  string body = 2;
  string severity = 3;
  string category = 4;
  string source = 5;
  string customer_id = 6;
  string author_username = 7;
  bool is_urgent = 8;
  string forgejo_repo = 9;
  int64 forgejo_issue_id = 10;
}

message CreateTicketResponse {
  ITTicket ticket = 1;
}

message GetTicketRequest {
  string ticket_id = 1;
}

message GetTicketResponse {
  ITTicket ticket = 1;
}

message ListTicketsRequest {
  string state = 1;
  string category = 2;
  int32 limit = 3;
  int32 offset = 4;
  string source = 5;
}

message ListTicketsResponse {
  repeated ITTicket tickets = 1;
}

message UpdateTicketRequest {
  string ticket_id = 1;
  string state = 2;
  string assignee_username = 3;
  string resolution_notes = 4;
}

message UpdateTicketResponse {
  ITTicket ticket = 1;
}

message AcknowledgeTicketRequest {
  string ticket_id = 1;
  string acknowledged_by = 2;
}

message AcknowledgeTicketResponse {
  ITTicket ticket = 1;
}

message CloseTicketRequest {
  string ticket_id = 1;
  string resolution_notes = 2;
}

message CloseTicketResponse {
  ITTicket ticket = 1;
}

message CreateCustomerTicketRequest {
  string customer_id = 1;
  string category = 2;
  string title = 3;
  string body = 4;
}

message CreateCustomerTicketResponse {
  ITTicket ticket = 1;
}

message ListCustomerTicketsRequest {
  string customer_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListCustomerTicketsResponse {
  repeated ITTicket tickets = 1;
}

message AddTicketCommentRequest {
  string ticket_id = 1;
  string author_username = 2;
  string comment = 3;
  bool is_internal = 4;
}

message AddTicketCommentResponse {
  TicketComment comment = 1;
}

message ListTicketCommentsRequest {
  string ticket_id = 1;
  bool include_internal = 2;
}

message ListTicketCommentsResponse {
  repeated TicketComment comments = 1;
}

message PebbleAlert {
  string alert_id = 1;
  string ticket_id = 2;
  string title = 3;
  string severity = 4;
  string room_zone = 5;
  bool acknowledged = 6;
  string created_at = 7;
  string body = 8;
  string author = 9;
}

message ListAlertsRequest {
  bool unacknowledged_only = 1;
}

message ListAlertsResponse {
  repeated PebbleAlert alerts = 1;
}

message CreateAlertRequest {
  string ticket_id = 1;
  string title = 2;
  string severity = 3;
  string room_zone = 4;
}

message CreateAlertResponse {
  PebbleAlert alert = 1;
}

message AcknowledgeAlertRequest {
  string alert_id = 1;
  string acknowledged_by = 2;
  int32 button_id = 3;
  string watch_id = 4;
  string device_id = 5;
}

message AcknowledgeAlertResponse {
  string alert_id = 1;
  string status = 2;
  string state = 3;
  string acknowledged_by = 4;
  string acknowledged_at = 5;
  string status_message = 6;
}

message SendPushNotificationRequest {
  string topic = 1;
  string title = 2;
  string message = 3;
  string priority = 4;
}

message SendPushNotificationResponse {
  string status = 1;
  string provider = 2;
  string topic = 3;
  string title = 4;
  string message = 5;
  string dispatched_at = 6;
}
